<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>TrustAI - Home</title>

<!-- SUPABASE JS SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root {
    --primary: #6366f1;
    --primary-glow: rgba(99, 102, 241, 0.15);
    --bg-main: #090d16;
    --bg-card: rgba(17, 24, 39, 0.75);
    --bg-side: #0f172a;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --border-color: rgba(255, 255, 255, 0.08);
    --radius-lg: 20px;
    --radius-md: 14px;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at 10% 0%,
            rgba(99, 102, 241, 0.12),
            transparent 40%
        ),
        radial-gradient(
            circle at 90% 20%,
            rgba(14, 165, 233, 0.08),
            transparent 40%
        ),
        var(--bg-main);

    color: var(--text-main);
    line-height: 1.6;
    min-height: 100vh;
}


/* =====================================================
   PAGE
   ===================================================== */

.page {
    width: min(1050px, calc(100% - 32px));
    margin: auto;
    padding-bottom: 40px;
}


/* =====================================================
   HEADER
   ===================================================== */

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 24px 0 16px;
}


/* =====================================================
   PROFILE BUTTON
   ===================================================== */

.profile-button {
    width: 48px;
    height: 48px;

    padding: 0;

    border: 1px solid var(--border-color);
    border-radius: 50%;

    background: transparent;

    cursor: pointer;

    overflow: hidden;

    flex-shrink: 0;

    transition:
        transform 0.2s ease,
        border-color 0.2s ease;
}

.profile-button:hover {
    transform: scale(1.05);
    border-color: var(--primary);
}

.default-avatar {
    width: 100%;
    height: 100%;

    background: #ffffff;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: flex-end;

    overflow: hidden;

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

.avatar-head {
    width: 15px;
    height: 15px;

    background: #000000;

    border-radius: 50%;

    margin-bottom: 3px;
}

.avatar-body {
    width: 30px;
    height: 18px;

    background: #000000;

    border-radius: 16px 16px 0 0;
}


.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.brand-shield {
    width: 48px;
    height: 48px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 14px;

    background:
        linear-gradient(
            135deg,
            #6366f1,
            #3b82f6
        );

    color: white;
    font-size: 24px;

    box-shadow:
        0 10px 25px -5px rgba(99, 102, 241, 0.4);
}

.brand-name {
    font-size: 26px;
    font-weight: 900;
    letter-spacing: -0.5px;

    background:
        linear-gradient(
            135deg,
            #f8fafc,
            #94a3b8
        );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}


/* =====================================================
   THREE DASH MENU BUTTON
   ===================================================== */

.menu-button {
    width: 48px;
    height: 48px;

    border: 1px solid var(--border-color);
    border-radius: 14px;

    background: rgba(15, 23, 42, 0.95);

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    gap: 5px;

    cursor: pointer;

    box-shadow:
        0 10px 25px -5px rgba(0,0,0,0.5);

    transition:
        transform 0.2s ease,
        border-color 0.2s ease;

    flex-shrink: 0;

    position: relative;
    z-index: 1101;

    padding: 0;

    appearance: none;
    -webkit-appearance: none;
}

.menu-button:hover {
    border-color: var(--primary);
    transform: translateY(-2px);
}

.menu-button:active {
    transform: scale(0.96);
}

.menu-button span {
    display: block;

    width: 22px;
    height: 3px;

    border-radius: 3px;

    background: #ffffff;

    transition:
        transform 0.2s ease,
        opacity 0.2s ease;
}


/* =====================================================
   SIDE MENU
   ===================================================== */

.side-menu {
    position: fixed;

    top: 0;
    left: 0;

    width: 300px;
    height: 100vh;
    height: 100dvh;

    background: var(--bg-side);

    border-right: 1px solid var(--border-color);

    z-index: 1100;

    padding: 30px 20px;

    overflow-y: auto;

    box-shadow:
        15px 0 30px rgba(0,0,0,0.3);

    transform: translateX(-105%);

    transition:
        transform 0.3s ease;

    visibility: hidden;

    pointer-events: none;
}

.side-menu.open {
    transform: translateX(0);

    visibility: visible;

    pointer-events: auto;
}


/* =====================================================
   MENU HEADER
   ===================================================== */

.menu-header {
    display: flex;
    align-items: center;

    gap: 12px;

    padding-bottom: 20px;

    border-bottom:
        1px solid var(--border-color);

    margin-bottom: 16px;
}

.menu-logo {
    font-size: 22px;
    font-weight: 800;

    background:
        linear-gradient(
            135deg,
            #818cf8,
            #38bdf8
        );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.menu-subtitle {
    color: var(--text-muted);
    font-size: 12px;
}


/* =====================================================
   MENU LINKS
   ===================================================== */

.menu-link {
    display: flex;
    align-items: center;

    gap: 14px;

    width: 100%;

    padding: 13px 14px;

    margin-bottom: 6px;

    border-radius: var(--radius-md);

    text-decoration: none;

    color: var(--text-muted);

    font-size: 14px;
    font-weight: 600;

    transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.2s ease;
}

.menu-link:hover {
    background:
        rgba(255, 255, 255, 0.05);

    color: var(--text-main);

    transform: translateX(4px);
}

.menu-icon {
    width: 24px;

    text-align: center;

    font-size: 17px;
}

.menu-divider {
    height: 1px;

    background:
        var(--border-color);

    margin: 18px 0;
}


/* =====================================================
   OVERLAY
   ===================================================== */

.menu-overlay {
    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,0.7);

    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);

    z-index: 1050;

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    transition:
        opacity 0.3s ease,
        visibility 0.3s ease;
}

.menu-overlay.show {
    opacity: 1;

    visibility: visible;

    pointer-events: auto;
}


/* =====================================================
   HERO
   ===================================================== */

.hero {
    position: relative;
    overflow: hidden;

    margin-top: 12px;

    padding: 40px 32px;

    border: 1px solid var(--border-color);

    border-radius: var(--radius-lg);

    background: var(--bg-card);

    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);

    box-shadow:
        0 20px 40px -15px rgba(0,0,0,0.4);
}

.hero::after {
    content: "";

    position: absolute;

    width: 200px;
    height: 200px;

    right: -60px;
    top: -60px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(99, 102, 241, 0.18),
            transparent 70%
        );
}

.hero h1 {
    position: relative;
    z-index: 1;

    max-width: 650px;

    margin: 0 0 16px;

    font-size:
        clamp(32px, 5.5vw, 46px);

    line-height: 1.15;

    letter-spacing: -1px;

    color: var(--text-main);

    font-weight: 800;
}

.hero h1 span {
    background:
        linear-gradient(
            135deg,
            #818cf8,
            #38bdf8
        );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.hero p {
    position: relative;
    z-index: 1;

    max-width: 720px;

    margin: 0;

    color: var(--text-muted);

    font-size: 15.5px;

    line-height: 1.65;
}


/* =====================================================
   SECTION TITLE
   ===================================================== */

.section-title {
    display: flex;

    align-items: center;

    gap: 12px;

    margin: 40px 0 20px;

    font-size: 22px;

    font-weight: 800;

    color: var(--text-main);

    letter-spacing: -0.3px;
}

.section-icon {
    width: 38px;
    height: 38px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 12px;

    background:
        var(--primary-glow);

    color: var(--primary);

    font-size: 18px;

    border:
        1px solid rgba(99, 102, 241, 0.2);
}


/* =====================================================
   CARDS
   ===================================================== */

.cards {
    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(280px, 1fr));

    gap: 20px;
}

.card {
    position: relative;

    overflow: hidden;

    padding: 28px;

    min-height: 200px;

    border:
        1px solid var(--border-color);

    border-radius: var(--radius-lg);

    background: var(--bg-card);

    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);

    text-decoration: none;

    box-shadow:
        0 10px 30px rgba(0,0,0,0.2);

    transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        border-color 0.25s ease;
}

.card:hover {
    transform: translateY(-5px);

    border-color:
        rgba(99, 102, 241, 0.4);

    box-shadow:
        0 20px 40px -10px rgba(0,0,0,0.4);
}

.card::before {
    content: "";

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 3px;

    background:
        var(--primary);
}

.message-card::before {
    background: #6366f1;
}

.conversation-card::before {
    background: #3b82f6;
}

.website-card::before {
    background: #06b6d4;
}

.security-card::before {
    background: #10b981;
}

.alert-card::before {
    background: #f97316;
}

.report-card::before {
    background: #ef4444;
}

.contact-card::before {
    background: #ec4899;
}


/* =====================================================
   CARD ICON
   ===================================================== */

.card-icon {
    width: 48px;
    height: 48px;

    display: flex;

    align-items: center;
    justify-content: center;

    margin-bottom: 18px;

    border-radius: var(--radius-md);

    background:
        rgba(255,255,255,0.04);

    border:
        1px solid var(--border-color);

    font-size: 22px;
}


/* =====================================================
   CARD TEXT
   ===================================================== */

.card h2 {
    margin: 0 0 8px;

    color: var(--text-main);

    font-size: 19px;

    font-weight: 750;

    letter-spacing: -0.2px;
}

.card p {
    margin: 0;

    color: var(--text-muted);

    font-size: 14.5px;

    line-height: 1.6;
}


/* =====================================================
   SECURITY CENTER
   ===================================================== */

.security-center {
    position: relative;

    overflow: hidden;

    margin-top: 36px;

    padding: 34px 30px;

    border-radius: var(--radius-lg);

    border:
        1px solid rgba(99, 102, 241, 0.2);

    background:
        linear-gradient(
            135deg,
            rgba(30, 27, 75, 0.8),
            rgba(49, 46, 129, 0.8)
        );

    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);

    color: white;

    box-shadow:
        0 20px 40px -15px rgba(0,0,0,0.5);
}

.security-center h2 {
    position: relative;
    z-index: 1;

    margin: 0 0 10px;

    font-size: 24px;

    font-weight: 800;
}

.security-center p {
    position: relative;
    z-index: 1;

    max-width: 680px;

    margin: 0 0 24px;

    color: #c7d2fe;

    font-size: 15px;
}

.security-button {
    position: relative;
    z-index: 2;

    display: inline-flex;

    padding: 13px 22px;

    border-radius: var(--radius-md);

    background: white;

    color: #1e1b4b;

    text-decoration: none;

    font-weight: 800;

    font-size: 14.5px;

    transition: all 0.2s ease;

    box-shadow:
        0 10px 20px rgba(0,0,0,0.2);
}

.security-button:hover {
    transform: translateY(-2px);

    box-shadow:
        0 14px 25px rgba(0,0,0,0.3);
}


/* =====================================================
   REMEMBER BOX
   ===================================================== */

.remember {
    margin-top: 36px;

    padding: 28px;

    border:
        1px solid rgba(234,179,8,0.2);

    border-radius: var(--radius-lg);

    background:
        rgba(161,98,7,0.12);

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
}

.remember h2 {
    margin: 0 0 12px;

    color: #fef08a;

    font-size: 20px;

    font-weight: 800;
}

.remember p {
    margin: 10px 0;

    color: #fef9c3;

    font-size: 14.5px;
}


/* =====================================================
   FOOTER
   ===================================================== */

<footer>

    <div class="logout-btn-container">
        <button type="button" class="logout-btn" onclick="handleLogout()">Log Out</button>
    </div>

    <div class="footer-brand" style="margin-top: 20px;">
        🛡️ TrustAI
    </div>

    <div>
        Stay safe. Stay informed. Stay one step ahead.
    </div>

</footer>


</div>


<!-- =====================================================
     JAVASCRIPT
     ===================================================== -->

<script>

/* =====================================================
   SUPABASE CONFIGURATION & OAUTH SESSION HANDLER
===================================================== */

const SUPABASE_URL = "https://xbsurdlaixeynaxarqma.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_C5gmKnTVYqNDhLD2zIikwg_lQFxPNL7";

let supabaseClient = null;

try {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
} catch (error) {
    console.error("Supabase initialization failed:", error);
}

async function handleOAuthCallback() {
    if (!supabaseClient) return;

    // Manually check if there are tokens in the URL hash from Supabase OAuth
    const hash = window.location.hash;
    if (hash && hash.includes("access_token")) {
        await supabaseClient.auth.getSession();
    }

    const { data: { session }, error } = await supabaseClient.auth.getSession();
    
    if (session) {
        localStorage.setItem("trustai_loggedIn", "true");
        if (session.user && session.user.user_metadata && session.user.user_metadata.full_name) {
            localStorage.setItem("trustai_userName", session.user.user_metadata.full_name);
        }
        
        // Clean up the URL hash so it looks clean in the browser bar
        if (window.location.hash) {
            window.history.replaceState({}, document.title, window.location.pathname);
        }
    } else {
        if (localStorage.getItem("trustai_loggedIn") !== "true") {
            window.location.href = "./index.html";
        }
    }
}

handleOAuthCallback();


/* =====================================================
   MENU ELEMENTS
   ===================================================== */

const menuButton =
    document.getElementById("menuButton");

const sideMenu =
    document.getElementById("sideMenu");

const menuOverlay =
    document.getElementById("menuOverlay");


/* =====================================================
   OPEN MENU
   ===================================================== */

function openMenu() {

    sideMenu.classList.add("open");

    menuOverlay.classList.add("show");

    menuButton.setAttribute(
        "aria-expanded",
        "true"
    );

}


/* =====================================================
   CLOSE MENU
   ===================================================== */

function closeMenu() {

    sideMenu.classList.remove("open");

    menuOverlay.classList.remove("show");

    menuButton.setAttribute(
        "aria-expanded",
        "false"
    );

}


/* =====================================================
   TOGGLE MENU
   ===================================================== */

menuButton.addEventListener(
    "click",
    function() {

        if (
            sideMenu.classList.contains("open")
        ) {

            closeMenu();

        } else {

            openMenu();

        }

    }
);


/* =====================================================
   CLOSE WHEN OVERLAY IS TAPPED
   ===================================================== */

menuOverlay.addEventListener(
    "click",
    closeMenu
);


/* =====================================================
   CLOSE MENU AFTER SELECTING A LINK
   ===================================================== */

const menuLinks =
    document.querySelectorAll(".menu-link");

menuLinks.forEach(function(link) {

    link.addEventListener(
        "click",
        closeMenu
    );

});


/* =====================================================
   CLOSE MENU WITH ESC KEY
   ===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Escape") {

            closeMenu();

        }

    }
);


/* =====================================================
   LOAD PROFILE PICTURE FROM PROFILE PAGE
   ===================================================== */

function loadHomeProfilePicture() {

    const avatar =
        document.getElementById(
            "homeProfileAvatar"
        );

    const savedPicture =
        localStorage.getItem(
            "trustai_profilePicture"
        );


    if (savedPicture) {

        avatar.style.backgroundImage =
            `url("${savedPicture}")`;

        avatar.style.backgroundSize =
            "cover";

        avatar.style.backgroundPosition =
            "center";

        avatar.style.backgroundRepeat =
            "no-repeat";

        avatar.innerHTML = "";

    } else {

        avatar.style.backgroundImage =
            "none";

        avatar.innerHTML = `
            <div class="avatar-head"></div>
            <div class="avatar-body"></div>
        `;

    }

}


/* =====================================================
   START PROFILE PICTURE
   ===================================================== */

loadHomeProfilePicture();


/* =====================================================
   LOGOUT FUNCTION
   ===================================================== */

async function handleLogout() {
    if (supabaseClient) {
        await supabaseClient.auth.signOut();
    }
    localStorage.removeItem("trustai_loggedIn");
    localStorage.removeItem("trustai_userName");
    window.location.href = "./index.html";
}

</script>

</body>

</html>
