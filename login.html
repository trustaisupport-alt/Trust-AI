<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Log In / Create Account — TrustAI</title>

<meta name="description"
      content="Log in or create your TrustAI account.">

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #f6f7f9;
    color: #111820;
    font-family: Arial, Helvetica, sans-serif;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;
}

.login-page {
    width: 100%;
    max-width: 440px;
}

.logo {
    text-align: center;
    margin-bottom: 25px;

    font-size: 27px;
    font-weight: 900;
}

.logo span {
    color: #1687ff;
}

.login-card {
    width: 100%;

    background: #ffffff;

    border: 1px solid #dfe3e8;

    border-radius: 15px;

    padding: 30px;

    box-shadow:
        0 8px 30px rgba(0,0,0,.07);
}

.login-card h1 {
    margin: 0;

    text-align: center;

    font-size: 26px;
}

.subtitle {
    margin: 9px 0 24px;

    text-align: center;

    color: #6b7280;

    font-size: 14px;

    line-height: 1.5;
}


/* ========================= */
/* MESSAGE */
/* ========================= */

.message {
    display: none;

    margin-bottom: 17px;

    padding: 11px 13px;

    border-radius: 8px;

    background: #eef6ff;

    border: 1px solid #c8e1ff;

    color: #145ea8;

    font-size: 13px;

    line-height: 1.5;
}

.message.show {
    display: block;
}

.message.error {
    background: #fff1f1;
    border-color: #ffcaca;
    color: #b42318;
}

.message.success {
    background: #effaf3;
    border-color: #b7ebc6;
    color: #18733b;
}


/* ========================= */
/* GOOGLE BUTTON */
/* ========================= */

.social-button {
    width: 100%;
    height: 48px;

    display: flex;
    align-items: center;
    justify-content: center;

    position: relative;

    border: 1px solid #cfd5dc;

    border-radius: 8px;

    background: #ffffff;

    color: #111820;

    font-size: 14px;
    font-weight: 700;

    cursor: pointer;

    margin-bottom: 10px;

    transition: .2s ease;
}

.social-button:hover {
    background: #f8fafc;
    border-color: #aeb7c2;
}

.social-button:active {
    transform: scale(.99);
}

.social-icon {
    position: absolute;
    left: 15px;

    display: flex;
    align-items: center;
}


/* ========================= */
/* DIVIDER */
/* ========================= */

.divider {
    display: flex;

    align-items: center;

    gap: 12px;

    margin: 23px 0;
}

.divider::before,
.divider::after {
    content: "";

    height: 1px;

    flex: 1;

    background: #e1e5ea;
}

.divider span {
    color: #8a939e;

    font-size: 12px;

    font-weight: 700;
}


/* ========================= */
/* FORM */
/* ========================= */

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;

    margin-bottom: 7px;

    font-size: 13px;

    font-weight: 700;
}

input {
    width: 100%;

    height: 48px;

    padding: 0 14px;

    border: 1px solid #bfc7d1;

    border-radius: 8px;

    background: #ffffff;

    color: #111820;

    font-size: 15px;

    outline: none;
}

input:focus {
    border-color: #1687ff;

    box-shadow:
        0 0 0 3px rgba(22,135,255,.12);
}

.password-wrapper {
    position: relative;
}

.password-wrapper input {
    padding-right: 48px;
}

.toggle-password-btn {
    position: absolute;

    right: 10px;
    top: 7px;

    width: 34px;
    height: 34px;

    border: none;

    background: transparent;

    cursor: pointer;

    font-size: 18px;
}


/* ========================= */
/* FORGOT PASSWORD */
/* ========================= */

.auth-links-row {
    display: flex;

    justify-content: flex-end;

    margin-top: 5px;

    margin-bottom: 15px;
}

.auth-links-row button {
    border: none;

    background: transparent;

    padding: 0;

    color: #1687ff;

    font-size: 13px;

    font-weight: 700;

    cursor: pointer;
}


/* ========================= */
/* SUBMIT */
/* ========================= */

.continue-button {
    width: 100%;

    height: 48px;

    border: none;

    border-radius: 8px;

    background: #1687ff;

    color: white;

    font-size: 14px;

    font-weight: 700;

    cursor: pointer;

    transition: .2s ease;
}

.continue-button:hover {
    background: #0877eb;
}

.continue-button:active {
    transform: scale(.99);
}

.continue-button:disabled {
    opacity: .65;

    cursor: not-allowed;
}


/* ========================= */
/* CREATE ACCOUNT */
/* ========================= */

.create-account {
    text-align: center;

    margin-top: 25px;

    padding-top: 23px;

    border-top: 1px solid #e5e8ec;

    color: #66707c;

    font-size: 13px;
}

.create-account a {
    color: #1687ff;

    font-weight: 700;

    text-decoration: none;

    cursor: pointer;
}


/* ========================= */
/* LEGAL */
/* ========================= */

.legal {
    margin-top: 20px;

    text-align: center;

    color: #8a939e;

    font-size: 11px;

    line-height: 1.6;
}

.legal a {
    color: #687482;

    text-decoration: underline;
}


/* ========================= */
/* MOBILE */
/* ========================= */

@media (max-width: 520px) {

    body {
        padding: 15px;

        align-items: flex-start;
    }

    .login-page {
        margin-top: 20px;
    }

    .login-card {
        padding: 24px 20px;
    }

}

</style>

</head>


<body>


<main class="login-page">


    <!-- LOGO -->

    <div class="logo">
        🛡️ Trust<span>AI</span>
    </div>


    <!-- LOGIN CARD -->

    <section class="login-card"
             id="loginCard">


        <h1 id="pageTitle">
            Log In
        </h1>


        <p class="subtitle"
           id="pageSubtitle">

            Access your TrustAI security dashboard

        </p>


        <!-- MESSAGE -->

        <div id="message"
             class="message">
        </div>


        <!-- GOOGLE -->

        <button
            type="button"
            id="googleBtn"
            class="social-button"
            onclick="loginWithGoogle()">

            <span class="social-icon">

                <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24">

                    <path
                        fill="#4285F4"
                        d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>

                    <path
                        fill="#34A853"
                        d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.14C3.15 21.36 7.23 24 12 24z"/>

                    <path
                        fill="#FBBC05"
                        d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.62H1.18C.43 8.13 0 9.83 0 12s.43 3.87 1.18 5.38l4.09-3.14z"/>

                    <path
                        fill="#EA4335"
                        d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.15 2.64 1.18 6.62l4.09 3.14c.95-2.85 3.6-4.96 6.73-4.96z"/>

                </svg>

            </span>

            Continue with Google

        </button>


        <div class="divider">
            <span>OR</span>
        </div>


        <!-- FORM -->

        <form id="loginForm"
              onsubmit="handleAuth(event)">


            <!-- FULL NAME -->

            <div class="form-group"
                 id="nameGroup"
                 style="display:none;">

                <label for="fullName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="John Doe"
                    autocomplete="name">

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        placeholder="••••••••"
                        minlength="6"
                        autocomplete="current-password"
                        required>

                    <button
                        type="button"
                        class="toggle-password-btn"
                        id="passwordToggle"
                        onclick="togglePasswordVisibility()">

                        🙈

                    </button>

                </div>

            </div>


            <!-- FORGOT PASSWORD -->

            <div class="auth-links-row">

                <button
                    type="button"
                    onclick="forgotPassword()">

                    Forgot password?

                </button>

            </div>


            <!-- SUBMIT -->

            <button
                type="submit"
                id="submitBtn"
                class="continue-button">

                Log In

            </button>


        </form>


        <!-- CREATE ACCOUNT -->

        <div class="create-account">

            <span id="toggleText">
                Don't have a TrustAI account?
            </span>

            <br><br>

            <a
                href="#"
                id="toggleLink"
                onclick="toggleAuthMode(event)">

                Create account

            </a>

        </div>


    </section>


    <!-- LEGAL -->

    <div class="legal">

        By continuing, you agree to the

        <a href="./terms.html">
            Terms of Service
        </a>

        and

        <a href="./privacy.html">
            Privacy Policy
        </a>.

    </div>


</main>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* ================================= */
/* SUPABASE CONFIGURATION */
/* ================================= */

const SUPABASE_URL =
    "https://opyjaljpowzgmkqlmjrb.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_ZcLyZffGbvjfp5twtbsI_Q_ni8ARBEY";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ================================= */
/* TRUSTAI SETTINGS */
/* ================================= */

const TRUSTAI_HOME =
    "./dashboard.html";


/* ================================= */
/* STATE */
/* ================================= */

let isSignUp = false;


/* ================================= */
/* MESSAGE SYSTEM */
/* ================================= */

function showMessage(text, type = "info") {

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.className =
        "message show " +
        (
            type === "error"
                ? "error"
                : type === "success"
                    ? "success"
                    : ""
        );

}


function hideMessage() {

    const message =
        document.getElementById("message");

    message.className = "message";

}


/* ================================= */
/* PASSWORD VISIBILITY */
/* ================================= */

function togglePasswordVisibility() {

    const password =
        document.getElementById("password");

    const button =
        document.getElementById("passwordToggle");


    if (password.type === "password") {

        password.type = "text";

        button.textContent = "👁️";

    } else {

        password.type = "password";

        button.textContent = "🙈";

    }

}


/* ================================= */
/* LOGIN / SIGNUP MODE */
/* ================================= */

function toggleAuthMode(event) {

    event.preventDefault();

    hideMessage();

    isSignUp = !isSignUp;


    const nameGroup =
        document.getElementById("nameGroup");

    const fullName =
        document.getElementById("fullName");

    const submitButton =
        document.getElementById("submitBtn");

    const toggleText =
        document.getElementById("toggleText");

    const toggleLink =
        document.getElementById("toggleLink");

    const pageTitle =
        document.getElementById("pageTitle");

    const pageSubtitle =
        document.getElementById("pageSubtitle");


    if (isSignUp) {

        nameGroup.style.display = "block";

        fullName.required = true;

        submitButton.textContent =
            "Create Account";

        toggleText.textContent =
            "Already have a TrustAI account?";

        toggleLink.textContent =
            "Log in";

        pageTitle.textContent =
            "Create TrustAI Account";

        pageSubtitle.textContent =
            "Start protecting your online activity";

    } else {

        nameGroup.style.display = "none";

        fullName.required = false;

        submitButton.textContent =
            "Log In";

        toggleText.textContent =
            "Don't have a TrustAI account?";

        toggleLink.textContent =
            "Create account";

        pageTitle.textContent =
            "Log In";

        pageSubtitle.textContent =
            "Access your TrustAI security dashboard";

    }

}


/* ================================= */
/* EMAIL AUTHENTICATION */
/* ================================= */

async function handleAuth(event) {

    event.preventDefault();

    hideMessage();


    const email =
        document.getElementById("email")
        .value
        .trim();

    const password =
        document.getElementById("password")
        .value;


    if (!email || !password) {

        showMessage(
            "Please enter your email and password.",
            "error"
        );

        return;

    }


    if (password.length < 6) {

        showMessage(
            "Password must contain at least 6 characters.",
            "error"
        );

        return;

    }


    const submitButton =
        document.getElementById("submitBtn");


    submitButton.disabled = true;


    submitButton.textContent =
        isSignUp
            ? "Creating Account..."
            : "Logging In...";


    try {

        /* ============================= */
        /* CREATE ACCOUNT */
        /* ============================= */

        if (isSignUp) {

            const fullName =
                document.getElementById("fullName")
                .value
                .trim();


            if (!fullName) {

                showMessage(
                    "Please enter your full name.",
                    "error"
                );

                resetSubmitButton();

                return;

            }


            const {
                data,
                error
            } =
                await supabaseClient.auth.signUp({

                    email: email,

                    password: password,

                    options: {

                        data: {
                            full_name: fullName
                        }

                    }

                });


            if (error) {

                throw error;

            }


            /*
             * Supabase may require email
             * confirmation before login.
             */

            if (
                data.user &&
                !data.session
            ) {

                showMessage(
                    "Account created. Please check your email to confirm your account before logging in.",
                    "success"
                );

                resetSubmitButton();

                return;

            }


            showMessage(
                "Account created successfully.",
                "success"
            );


            setTimeout(
                () => {
                    window.location.href =
                        TRUSTAI_HOME;
                },
                700
            );


            return;

        }


        /* ============================= */
        /* LOGIN */
        /* ============================= */

        const {
            data,
            error
        } =
            await supabaseClient.auth.signInWithPassword({

                email: email,

                password: password

            });


        if (error) {

            throw error;

        }


        if (!data.session) {

            throw new Error(
                "Login session could not be created."
            );

        }


        showMessage(
            "Login successful. Opening TrustAI...",
            "success"
        );


        setTimeout(
            () => {

                window.location.href =
                    TRUSTAI_HOME;

            },
            500
        );


    } catch (error) {

        console.error(
            "TrustAI authentication error:",
            error
        );


        let errorMessage =
            "Something went wrong. Please try again.";


        if (
            error.message
                .toLowerCase()
                .includes("invalid login credentials")
        ) {

            errorMessage =
                "Incorrect email or password.";

        } else if (
            error.message
                .toLowerCase()
                .includes("email not confirmed")
        ) {

            errorMessage =
                "Please confirm your email address before logging in.";

        } else if (
            error.message
                .toLowerCase()
                .includes("user already registered")
        ) {

            errorMessage =
                "An account with this email already exists.";

        } else if (error.message) {

            errorMessage =
                error.message;

        }


        showMessage(
            errorMessage,
            "error"
        );


        resetSubmitButton();

    }

}


/* ================================= */
/* RESET BUTTON */
/* ================================= */

function resetSubmitButton() {

    const submitButton =
        document.getElementById("submitBtn");

    submitButton.disabled = false;

    submitButton.textContent =
        isSignUp
            ? "Create Account"
            : "Log In";

}


/* ================================= */
/* GOOGLE LOGIN */
/* ================================= */

async function loginWithGoogle() {

    hideMessage();


    const button =
        document.getElementById("googleBtn");


    button.disabled = true;

    button.textContent =
        "Connecting to Google...";


    try {

        const {
            data,
            error
        } =
            await supabaseClient.auth.signInWithOAuth({

                provider: "google",

                options: {

                    redirectTo:
                        window.location.origin +
                        window.location.pathname

                }

            });


        if (error) {

            throw error;

        }


    } catch (error) {

        console.error(
            "Google login error:",
            error
        );


        showMessage(
            "Google sign-in is not configured yet. Configure Google OAuth in Supabase first.",
            "error"
        );


        button.disabled = false;

        button.innerHTML = `

            <span class="social-icon">

                <svg
                    width="18"
                    height="18"
         viewBox="0 0 24 24">

                    <path
                        fill="#4285F4"
                        d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>

                    <path
                        fill="#34A853"
                        d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.14C3.15 21.36 7.23 24 12 24z"/>

                    <path
                        fill="#FBBC05"
                        d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.62H1.18C.43 8.13 0 9.83 0 12s.43 3.87 1.18 5.38l4.09-3.14z"/>

                    <path
                        fill="#EA4335"
                        d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.15 2.64 1.18 6.62l4.09 3.14c.95-2.85 3.6-4.96 6.73-4.96z"/>

                </svg>

            </span>

            Continue with Google

        `;

    }

}


/* ================================= */
/* FORGOT PASSWORD */
/* ================================= */

async function forgotPassword() {

    hideMessage();


    const email =
        document.getElementById("email")
        .value
        .trim();


    if (!email) {

        showMessage(
            "Enter your email address first, then tap Forgot password.",
            "error"
        );

        return;

    }


    try {

        const {
            error
        } =
            await supabaseClient.auth
                .resetPasswordForEmail(
                    email,
                    {
                        redirectTo:
                            window.location.origin +
                            "/reset-password.html"
                    }
                );


        if (error) {

            throw error;

        }


        showMessage(
            "Password reset instructions have been sent to your email.",
            "success"
        );


    } catch (error) {

        console.error(
            "Password reset error:",
            error
        );


        showMessage(
            error.message ||
            "Unable to send password reset email.",
            "error"
        );

    }

}


/* ================================= */
/* AUTH SESSION CHECK */
/* ================================= */

async function checkExistingSession() {

    try {

        const {
            data
        } =
            await supabaseClient.auth.getSession();


        if (
            data &&
            data.session
        ) {

            window.location.href =
                TRUSTAI_HOME;

        }

    } catch (error) {

        console.error(
            "Session check error:",
            error
        );

    }

}


/* ================================= */
/* AUTH STATE LISTENER */
/* ================================= */

supabaseClient.auth.onAuthStateChange(
    (event, session) => {

        if (
            event === "SIGNED_IN" &&
            session
        ) {

            /*
             * Avoid forcing an immediate redirect
             * during password recovery flows.
             */

            if (
                !window.location.pathname
                    .includes("reset-password")
            ) {

                window.location.href =
                    TRUSTAI_HOME;

            }

        }

    }
);


/* ================================= */
/* START */
/* ================================= */

checkExistingSession();

</script>


</body>

</html>
