<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Log In / Create Account — TrustAI</title><meta name="description"
content="Log in or create your TrustAI account.">

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;

    background: #f6f7f9;

    color: #111820;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;
}

.login-page {
    width: 100%;
    max-width: 440px;
}

.logo {
    text-align: center;
    margin-bottom: 25px;

    font-size: 27px;
    font-weight: 900;
}

.logo span {
    color: #1687ff;
}

.login-card {
    width: 100%;

    background: #ffffff;

    border: 1px solid #dfe3e8;

    border-radius: 15px;

    padding: 30px;

    box-shadow:
        0 8px 30px rgba(0,0,0,.07);
}

.login-card h1 {
    margin: 0;

    text-align: center;

    font-size: 26px;
}

.subtitle {
    margin: 9px 0 24px;

    text-align: center;

    color: #6b7280;

    font-size: 14px;

    line-height: 1.5;
}

/* MESSAGE */

.message {
    display: none;

    margin-bottom: 17px;

    padding: 11px 13px;

    border-radius: 8px;

    background: #eef6ff;

    border: 1px solid #c8e1ff;

    color: #145ea8;

    font-size: 13px;

    line-height: 1.5;
}

.message.show {
    display: block;
}

.message.error {
    background: #fff1f1;
    border-color: #ffcaca;
    color: #b42318;
}

.message.success {
    background: #effaf3;
    border-color: #b7ebc6;
    color: #18733b;
}

/* FORM */

.form-group {
    margin-bottom: 16px;
}

.form-group label {
    display: block;

    margin-bottom: 7px;

    font-size: 13px;

    font-weight: 700;
}

input {
    width: 100%;

    height: 48px;

    padding: 0 14px;

    border: 1px solid #bfc7d1;

    border-radius: 8px;

    background: #ffffff;

    color: #111820;

    font-size: 15px;

    outline: none;
}

input:focus {
    border-color: #1687ff;

    box-shadow:
        0 0 0 3px rgba(22,135,255,.12);
}

.password-wrapper {
    position: relative;
}

.password-wrapper input {
    padding-right: 50px;
}

.toggle-password-btn {
    position: absolute;

    right: 7px;
    top: 7px;

    width: 34px;
    height: 34px;

    border: none;

    background: transparent;

    cursor: pointer;

    font-size: 18px;
}

/* FORGOT PASSWORD */

.auth-links-row {
    display: flex;

    justify-content: flex-end;

    margin-top: -3px;

    margin-bottom: 17px;
}

.auth-links-row button {
    border: none;

    background: transparent;

    padding: 0;

    color: #1687ff;

    font-size: 13px;

    font-weight: 700;

    cursor: pointer;
}

/* CONTINUE */

.continue-button {
    width: 100%;

    height: 48px;

    border: none;

    border-radius: 8px;

    background: #1687ff;

    color: white;

    font-size: 14px;

    font-weight: 700;

    cursor: pointer;

    transition: .2s ease;
}

.continue-button:hover {
    background: #0877eb;
}

.continue-button:active {
    transform: scale(.99);
}

.continue-button:disabled {
    opacity: .65;
    cursor: not-allowed;
}

/* CREATE ACCOUNT */

.create-account {
    text-align: center;

    margin-top: 25px;

    padding-top: 23px;

    border-top: 1px solid #e5e8ec;

    color: #66707c;

    font-size: 13px;
}

.create-account a {
    color: #1687ff;

    font-weight: 700;

    text-decoration: none;

    cursor: pointer;
}

/* SECURITY */

.security-note {
    margin-top: 20px;

    text-align: center;

    color: #8a939e;

    font-size: 11px;

    line-height: 1.5;
}

/* LEGAL */

.legal {
    margin-top: 20px;

    text-align: center;

    color: #8a939e;

    font-size: 11px;

    line-height: 1.6;
}

.legal a {
    color: #687482;

    text-decoration: underline;
}

/* MOBILE */

@media (max-width: 520px) {

    body {
        padding: 15px;

        align-items: flex-start;
    }

    .login-page {
        margin-top: 20px;
    }

    .login-card {
        padding: 24px 20px;
    }

}

</style></head><body><main class="login-page"><div class="logo">
    🛡️ Trust<span>AI</span>
</div>

<section class="login-card">

    <h1 id="pageTitle">
        Log In
    </h1>

    <p
        class="subtitle"
        id="pageSubtitle">

        Access your TrustAI security dashboard

    </p>

    <div
        id="message"
        class="message">
    </div>

    <form
        id="authForm"
        onsubmit="handleAuth(event)">

        <!-- FULL NAME -->

        <div
            class="form-group"
            id="nameGroup"
            style="display:none;">

            <label for="fullName">
                Full Name
            </label>

            <input
                type="text"
                id="fullName"
                placeholder="John Doe"
                autocomplete="name">

        </div>

        <!-- EMAIL -->

        <div class="form-group">

            <label for="email">
                Email address
            </label>

            <input
                type="email"
                id="email"
                placeholder="you@example.com"
                autocomplete="email"
                required>

        </div>

        <!-- PASSWORD -->

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <div class="password-wrapper">

                <input
                    type="password"
                    id="password"
                    placeholder="At least 6 characters"
                    minlength="6"
                    autocomplete="current-password"
                    required>

                <button
                    type="button"
                    class="toggle-password-btn"
                    id="passwordToggle"
                    onclick="togglePasswordVisibility()"
                    aria-label="Show password">

                    🙈

                </button>

            </div>

        </div>

        <!-- FORGOT PASSWORD -->

        <div
            class="auth-links-row"
            id="forgotRow">

            <button
                type="button"
                onclick="forgotPassword()">

                Forgot password?

            </button>

        </div>

        <!-- SUBMIT -->

        <button
            type="submit"
            id="submitBtn"
            class="continue-button">

            Log In

        </button>

    </form>

    <!-- MODE SWITCH -->

    <div class="create-account">

        <span id="toggleText">
            Don't have a TrustAI account?
        </span>

        <br><br>

        <a
            href="#"
            id="toggleLink"
            onclick="toggleAuthMode(event)">

            Create account

        </a>

    </div>

    <div class="security-note">
        🔒 Your TrustAI account is protected by
        Supabase authentication.
    </div>

</section>

<div class="legal">

    By continuing, you agree to the

    <a href="./terms.html">
        Terms of Service
    </a>

    and

    <a href="./privacy.html">
        Privacy Policy
    </a>.

</div>

</main><!-- SUPABASE --><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>

/* ========================================= */
/* TRUSTAI SUPABASE CONFIGURATION */
/* ========================================= */

const SUPABASE_URL =
    "https://opyjaljpowzgmkqlmjrb.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_ZcLyZffGbvjfp5twtbsI_Q_ni8ARBEy";


/* ========================================= */
/* CREATE SUPABASE CLIENT */
/* ========================================= */

let supabaseClient = null;

try {

    if (
        !window.supabase ||
        typeof window.supabase.createClient !== "function"
    ) {

        throw new Error(
            "Supabase library failed to load."
        );

    }

    supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

    console.log(
        "TrustAI Supabase client initialized."
    );

} catch (error) {

    console.error(
        "Supabase initialization error:",
        error
    );

}


/* ========================================= */
/* STATE */
/* ========================================= */

let isSignUp = false;


/* ========================================= */
/* MESSAGE */
/* ========================================= */

function showMessage(
    text,
    type = "info"
) {

    const message =
        document.getElementById("message");

    if (!message) return;

    message.textContent = text;

    message.className =
        "message show " +
        (
            type === "error"
                ? "error"
                : type === "success"
                    ? "success"
                    : ""
        );

}


function hideMessage() {

    const message =
        document.getElementById("message");

    if (!message) return;

    message.className =
        "message";

}


/* ========================================= */
/* PASSWORD VISIBILITY */
/* ========================================= */

function togglePasswordVisibility() {

    const password =
        document.getElementById("password");

    const button =
        document.getElementById(
            "passwordToggle"
        );

    if (!password || !button) {
        return;
    }

    if (
        password.type === "password"
    ) {

        password.type = "text";

        button.textContent = "👁️";

        button.setAttribute(
            "aria-label",
            "Hide password"
        );

    } else {

        password.type = "password";

        button.textContent = "🙈";

        button.setAttribute(
            "aria-label",
            "Show password"
        );

    }

}


/* ========================================= */
/* LOGIN / SIGNUP MODE */
/* ========================================= */

function toggleAuthMode(event) {

    if (event) {
        event.preventDefault();
    }

    hideMessage();

    isSignUp = !isSignUp;

    const nameGroup =
        document.getElementById(
            "nameGroup"
        );

    const submitButton =
        document.getElementById(
            "submitBtn"
        );

    const toggleText =
        document.getElementById(
            "toggleText"
        );

    const toggleLink =
        document.getElementById(
            "toggleLink"
        );

    const pageTitle =
        document.getElementById(
            "pageTitle"
        );

    const pageSubtitle =
        document.getElementById(
            "pageSubtitle"
        );

    const forgotRow =
        document.getElementById(
            "forgotRow"
        );

    const fullName =
        document.getElementById(
            "fullName"
        );


    if (isSignUp) {

        nameGroup.style.display =
            "block";

        fullName.required = true;

        submitButton.textContent =
            "Create Account";

        toggleText.textContent =
            "Already have a TrustAI account?";

        toggleLink.textContent =
            "Log in";

        pageTitle.textContent =
            "Create TrustAI Account";

        pageSubtitle.textContent =
            "Start protecting your online activity";

        forgotRow.style.display =
            "none";

    } else {

        nameGroup.style.display =
            "none";

        fullName.required = false;

        submitButton.textContent =
            "Log In";

        toggleText.textContent =
            "Don't have a TrustAI account?";

        toggleLink.textContent =
            "Create account";

        pageTitle.textContent =
            "Log In";

        pageSubtitle.textContent =
            "Access your TrustAI security dashboard";

        forgotRow.style.display =
            "flex";

    }

}


/* ========================================= */
/* SAVE LOCAL USER INFO */
/* ========================================= */

function saveLocalUser(user) {

    if (!user) return;

    localStorage.setItem(
        "trustai_loggedIn",
        "true"
    );

    localStorage.setItem(
        "trustai_userEmail",
        user.email || ""
    );

    const fullName =
        user.user_metadata &&
        user.user_metadata.full_name
            ? user.user_metadata.full_name
            : "";

    if (fullName) {

        localStorage.setItem(
            "trustai_userName",
            fullName
        );

    }

}


/* ========================================= */
/* GO TO HOME */
/* ========================================= */

function goToHome(user) {

    saveLocalUser(user);

    window.location.href =
        "./home.html";

}


/* ========================================= */
/* AUTHENTICATION */
/* ========================================= */

async function handleAuth(event) {

    event.preventDefault();

    hideMessage();

    const email =
        document.getElementById("email")
        .value
        .trim();

    const password =
        document.getElementById("password")
        .value;

    const submitButton =
        document.getElementById("submitBtn");


    if (!supabaseClient) {

        showMessage(
            "TrustAI could not connect to the authentication service. Please refresh the page and try again.",
            "error"
        );

        return;

    }


    if (!email || !password) {

        showMessage(
            "Please enter your email and password.",
            "error"
        );

        return;

    }


    if (password.length < 6) {

        showMessage(
            "Your password must contain at least 6 characters.",
            "error"
        );

        return;

    }


    submitButton.disabled = true;

    submitButton.textContent =
        isSignUp
            ? "Creating Account..."
            : "Logging In...";


    try {

        /* ================================= */
        /* CREATE ACCOUNT */
        /* ================================= */

        if (isSignUp) {

            const fullName =
                document.getElementById(
                    "fullName"
                )
                .value
                .trim();


            if (!fullName) {

                showMessage(
                    "Please enter your full name.",
                    "error"
                );

                submitButton.disabled =
                    false;

                submitButton.textContent =
                    "Create Account";

                return;

            }


            const {
                data,
                error
            } =
                await supabaseClient.auth.signUp({

                    email: email,

                    password: password,

                    options: {

                        data: {

                            full_name:
                                fullName

                        }

                    }

                });


            if (error) {

                console.error(
                    "Sign-up error:",
                    error
                );

                showMessage(
                    error.message ||
                    "Unable to create your account.",
                    "error"
                );

                return;

            }


            /*
                Supabase may require email
                confirmation depending on
                your project settings.
            */

            if (
                data &&
                data.session
            ) {

                showMessage(
                    "Account created successfully. Opening TrustAI...",
                    "success"
                );

                setTimeout(
                    function() {

                        goToHome(
                            data.user
                        );

                    },
                    700
                );

            } else {

                showMessage(
                    "Account created. Please check your email to confirm your account, then log in.",
                    "success"
                );

            }


            return;

        }


        /* ================================= */
        /* NORMAL LOGIN */
        /* ================================= */

        const {
            data,
            error
        } =
            await supabaseClient.auth.signInWithPassword({

                email: email,

                password: password

            });


        if (error) {

            console.error(
                "Login error:",
                error
            );

            let errorMessage =
                error.message ||
                "Unable to log in.";

            if (
                error.message &&
                error.message
                    .toLowerCase()
                    .includes("invalid login credentials")
            ) {

                errorMessage =
                    "Incorrect email or password.";

            }

            if (
                error.message &&
                error.message
                    .toLowerCase()
                    .includes("email not confirmed")
            ) {

                errorMessage =
                    "Please confirm your email address before logging in.";

            }

            showMessage(
                errorMessage,
                "error"
            );

            return;

        }


        if (
            data &&
            data.user
        ) {

            showMessage(
                "Login successful. Opening TrustAI...",
                "success"
            );

            setTimeout(
                function() {

                    goToHome(
                        data.user
                    );

                },
                500
            );

        } else {

            showMessage(
                "Login completed, but no user session was returned.",
                "error"
            );

        }


    } catch (error) {

        console.error(
            "Unexpected authentication error:",
            error
        );

        showMessage(
            error.message ||
            "Something went wrong. Please try again.",
            "error"
        );

    } finally {

        submitButton.disabled =
            false;

        submitButton.textContent =
            isSignUp
                ? "Create Account"
                : "Log In";

    }

}


/* ========================================= */
/* FORGOT PASSWORD */
/* ========================================= */

async function forgotPassword() {

    hideMessage();

    const email =
        document.getElementById("email")
        .value
        .trim();


    if (!email) {

        showMessage(
            "Enter your email address first, then tap Forgot password.",
            "error"
        );

        return;

    }


    if (!supabaseClient) {

        showMessage(
            "TrustAI could not connect to the authentication service.",
            "error"
        );

        return;

    }


    try {

        const {
            error
        } =
            await supabaseClient.auth
                .resetPasswordForEmail(
                    email,
                    {
                        redirectTo:
                            window.location.origin +
                            window.location.pathname
                    }
                );


        if (error) {

            console.error(
                "Password reset error:",
                error
            );

            showMessage(
                error.message ||
                "Unable to send the password reset email.",
                "error"
            );

            return;

        }


        showMessage(
            "If an account exists for that email, a password reset email has been sent.",
     
            "success"
        );


    } catch (error) {

        console.error(
            "Unexpected password reset error:",
            error
        );

        showMessage(
            "Unable to process the password reset request.",
            "error"
        );

    }

}


/* ========================================= */
/* CHECK EXISTING SESSION */
/* ========================================= */

async function checkExistingSession() {

    if (!supabaseClient) {
        return;
    }


    try {

        const {
            data,
            error
        } =
            await supabaseClient.auth
                .getSession();


        if (error) {

            console.error(
                "Session check error:",
                error
            );

            return;

        }


        if (
            data &&
            data.session &&
            data.session.user
        ) {

            /*
                A user is already logged in.
                Keep the login page usable,
                but remember their session.
            */

            saveLocalUser(
                data.session.user
            );

        }

    } catch (error) {

        console.error(
            "Session check failed:",
            error
        );

    }

}


/* ========================================= */
/* START */
/* ========================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        console.log(
            "TrustAI login page loaded."
        );

        checkExistingSession();

    }
);

</script>

</body>

</html>
