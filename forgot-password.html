<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trust AI - Forgot Password</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 { margin-bottom: 20px; color: #333; }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background-color: #0056b3; }
        #message { margin-top: 15px; font-size: 14px; color: green; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Reset Password</h2>
        <p>Enter your email address to receive a 6-digit verification code.</p>
        
        <form id="forgotForm">
            <input type="email" id="userEmail" placeholder="Enter your email" required>
            <button type="submit" id="sendBtn">Send Verification Code</button>
        </form>
        
        <div id="message"></div>
    </div>

    <script>
        document.getElementById('forgotForm').addEventListener('submit', function(event) {
            event.preventDefault();
            
            const email = document.getElementById('userEmail').value;
            const sendBtn = document.getElementById('sendBtn');
            const messageDiv = document.getElementById('message');
            
            // Generate a random 6-digit passcode
            const passCode = Math.floor(100000 + Math.random() * 900000);
            
            sendBtn.innerText = "Sending...";
            sendBtn.disabled = true;

            // Simulated request delay
            setTimeout(function() {
                messageDiv.style.color = "green";
                messageDiv.innerText = "Success! Verification code sent to " + email;
                sendBtn.innerText = "Send Verification Code";
                sendBtn.disabled = false;
                
                // Save code locally for verification
                localStorage.setItem('verificationCode', passCode);
                localStorage.setItem('resetEmail', email);
            }, 800);
        });
    </script>
<script src="global-language.js"></script>
</body>
</html>
