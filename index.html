<!DOCTYPE html>
<html lang="en">

<head>
<meta name="google-site-verification" content="3VSYO-LwkGIdjwjHdyZeFTLnffRQAziBbU-t0P51IJw" />
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>TrustAI — Advanced Threat Protection</title>

<style>

/* =====================================================
   TRUSTAI — ENTERPRISE SECURITY SPLASH SCREEN
   ===================================================== */

:root {
    --bg: #030712;
    --blue: #38bdf8;
    --blue-dark: #1d4ed8;
    --purple: #7c3aed;
    --text: #f8fafc;
    --muted: #94a3b8;
    --success: #10b981;
}


/* RESET */

* {
    box-sizing: border-box;
    -webkit-font-smoothing: antialiased;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    color: var(--text);

    background:
        radial-gradient(
            circle at 50% 40%,
            rgba(29, 78, 216, 0.15),
            transparent 30%
        ),
        radial-gradient(
            circle at 15% 15%,
            rgba(124, 58, 237, 0.08),
            transparent 35%
        ),
        radial-gradient(
            circle at 85% 85%,
            rgba(14, 165, 233, 0.06),
            transparent 35%
        ),
        linear-gradient(
            145deg,
            #02040a,
            #050b16 50%,
            #02040a
        );

    transition:
        opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1),
        transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
}


/* PAGE EXIT */

body.page-exit {
    opacity: 0;
    transform: scale(1.02);
    pointer-events: none;
}


/* =====================================================
   BACKGROUND GLOW
   ===================================================== */

.background-glow {
    position: fixed;

    width: 480px;
    height: 480px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(56, 189, 248, 0.08),
            transparent 70%
        );

    filter: blur(20px);

    pointer-events: none;

    animation:
        ambientGlow
        6s
        ease-in-out
        infinite alternate;
}

@keyframes ambientGlow {

    from {
        transform: scale(0.85);
        opacity: 0.5;
    }

    to {
        transform: scale(1.15);
        opacity: 0.9;
    }

}


/* =====================================================
   PARTICLES
   ===================================================== */

.particle {
    position: fixed;

    width: 2px;
    height: 2px;

    border-radius: 50%;

    background: rgba(56, 189, 248, 0.5);

    box-shadow:
        0 0 8px rgba(56, 189, 248, 0.6);

    pointer-events: none;

    animation:
        floatParticle
        var(--duration)
        ease-in-out
        infinite;
}

.p1 { left: 15%; top: 25%; --duration: 5.5s; }
.p2 { left: 80%; top: 18%; --duration: 6.5s; }
.p3 { left: 22%; top: 78%; --duration: 7.2s; }
.p4 { left: 75%; top: 75%; --duration: 5.8s; }
.p5 { left: 50%; top: 12%; --duration: 6.0s; }

@keyframes floatParticle {
    0%, 100% {
        transform: translateY(0) scale(1);
        opacity: 0.2;
    }
    50% {
        transform: translateY(-20px) scale(1.3);
        opacity: 0.8;
    }
}


/* =====================================================
   MAIN SPLASH
   ===================================================== */

.splash {
    position: relative;
    z-index: 5;

    width: min(460px, calc(100% - 32px));
    padding: 32px 20px;
    text-align: center;

    animation:
        splashIn
        0.9s
        cubic-bezier(0.16, 1, 0.3, 1)
        forwards;
}

@keyframes splashIn {
    from {
        opacity: 0;
        transform: translateY(12px) scale(0.97);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}


/* =====================================================
   SHIELD WRAPPER
   ===================================================== */

.logo-wrapper {
    position: relative;
    width: 130px;
    height: 130px;
    margin: 0 auto 24px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.logo-wrapper::before {
    content: "";
    position: absolute;
    inset: 8px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(56, 189, 248, 0.15), transparent 70%);
    animation: logoGlow 3s ease-in-out infinite alternate;
}

.logo-wrapper::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1px solid rgba(56, 189, 248, 0.12);
    border-top-color: rgba(56, 189, 248, 0.6);
    animation: rotateRing 5s linear infinite;
}

@keyframes logoGlow {
    from { transform: scale(0.9); opacity: 0.4; }
    to { transform: scale(1.08); opacity: 0.9; }
}

@keyframes rotateRing {
    to { transform: rotate(360deg); }
}


/* =====================================================
   SVG SHIELD
   ===================================================== */

.trust-shield {
    position: relative;
    z-index: 2;
    width: 96px;
    height: 96px;
    filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.35));
    animation: shieldPulse 3s ease-in-out infinite alternate;
}

@keyframes shieldPulse {
    from { transform: scale(1); }
    to { transform: scale(1.025); }
}


/* =====================================================
   BRAND & TAGLINE
   ===================================================== */

.brand-name {
    margin: 0;
    font-size: clamp(30px, 7vw, 42px);
    font-weight: 800;
    letter-spacing: -1.5px;
    background: linear-gradient(135deg, #ffffff, #cbd5e1, #38bdf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.brand-name span {
    background: linear-gradient(135deg, #38bdf8, #818cf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.tagline {
    margin-top: 6px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
}


/* =====================================================
   STATUS AREA
   ===================================================== */

.status-area {
    min-height: 40px;
    margin-top: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.status {
    color: #94a3b8;
    font-size: 13.5px;
    font-weight: 400;
    letter-spacing: 0.2px;
    transition: opacity 0.3s ease, transform 0.3s ease;
}

.status.hidden {
    opacity: 0;
    transform: translateY(4px);
}


/* =====================================================
   SECURITY BADGE
   ===================================================== */

.security-state {
    margin-top: 16px;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 6px 12px;
    border: 1px solid rgba(16, 185, 129, 0.2);
    border-radius: 999px;
    background: rgba(16, 185, 129, 0.04);
    color: #34d399;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.4px;
}

.security-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.12), 0 0 10px rgba(16, 185, 129, 0.6);
    animation: statusPulse 2s infinite;
}

@keyframes statusPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
}


/* =====================================================
   FOOTER
   ===================================================== */

.footer-text {
    position: fixed;
    bottom: 20px;
    left: 0;
    right: 0;
    text-align: center;
    color: #475569;
    font-size: 11px;
    letter-spacing: 0.5px;
}

</style>
</head>

<body>

<!-- BACKGROUND EFFECTS -->
<div class="background-glow"></div>
<div class="particle p1"></div>
<div class="particle p2"></div>
<div class="particle p3"></div>
<div class="particle p4"></div>
<div class="particle p5"></div>

<!-- MAIN SPLASH CONTAINER -->
<main class="splash">

    <!-- SHIELD LOGO -->
    <div class="logo-wrapper">
        <svg class="trust-shield" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="shieldOuter" x1="10" y1="10" x2="90" y2="90">
                    <stop offset="0%" stop-color="#38bdf8"/>
                    <stop offset="60%" stop-color="#1d4ed8"/>
                    <stop offset="100%" stop-color="#7c3aed"/>
                </linearGradient>
                <linearGradient id="shieldInner" x1="50" y1="10" x2="50" y2="90">
                    <stop offset="0%" stop-color="#0f172a"/>
                    <stop offset="100%" stop-color="#020617"/>
                </linearGradient>
            </defs>

            <path d="M50 5 L89 18 V46 C89 69 72 83 50 94 C28 83 11 69 11 46 V18 L50 5Z" fill="url(#shieldOuter)"/>
            <path d="M50 11 L83 22 V45 C83 64 69 77 50 87 C31 77 17 64 17 45 V22 L50 11Z" fill="url(#shieldInner)"/>

            <text x="50" y="51" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="24" font-weight="900" letter-spacing="1" fill="white">
                AI
            </text>

            <circle cx="76" cy="25" r="2.5" fill="#7dd3fc" opacity="0.9"/>
        </svg>
    </div>

    <!-- BRAND INFO -->
    <h1 class="brand-name">
        Trust<span>AI</span>
    </h1>

    <div class="tagline">
        Autonomous Threat Protection
    </div>

    <!-- DYNAMIC STATUS -->
    <div class="status-area">
        <div class="status" id="statusText">
            Initializing secure runtime...
        </div>
    </div>

    <!-- SECURITY STATE BADGE -->
    <div class="security-state">
        <span class="security-dot"></span>
        Zero-Trust Protocols Active
    </div>

</main>

<!-- FOOTER -->
<div class="footer-text">
    TrustAI • Enterprise Identity & Scam Shield
</div>

<script>
/* =====================================================
   REFINED TRUSTAI LOAD SEQUENCE
   ===================================================== */

const delay = (ms) => new Promise(resolve => setTimeout(resolve, ms));

async function initializeSecuritySequence() {
    const status = document.getElementById("statusText");

    await delay(1200);
    status.classList.add("hidden");
    await delay(300);
    status.textContent = "Verifying client integrity...";
    status.classList.remove("hidden");

    await delay(1300);
    status.classList.add("hidden");
    await delay(300);
    status.textContent = "Establishing encrypted handshake...";
    status.classList.remove("hidden");

    await delay(1300);
    status.classList.add("hidden");
    await delay(300);
    status.textContent = "Environment verified and secured.";
    status.classList.remove("hidden");

    await delay(1400);

    document.body.classList.add("page-exit");
    await delay(700);

    window.location.href = "login.html";
}

document.addEventListener("DOMContentLoaded", initializeSecuritySequence);
</script>

</body>
</html>
