<!DOCTYPE html>
<html lang="en">

<head>
<meta name="google-site-verification" content="3VSYO-LwkGIdjwjHdyZeFTLnffRQAziBbU-t0P51IJw" />
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>TrustAI</title>

<style>

/* =====================================================
   TRUSTAI — PREMIUM SECURITY SPLASH SCREEN
   ===================================================== */

:root {
    --bg: #050b16;
    --blue: #38bdf8;
    --blue-dark: #2563eb;
    --purple: #7c3aed;
    --text: #f8fafc;
    --muted: #94a3b8;
}


/* RESET */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    color: var(--text);

    background:
        radial-gradient(
            circle at 50% 42%,
            rgba(37, 99, 235, 0.18),
            transparent 25%
        ),
        radial-gradient(
            circle at 20% 20%,
            rgba(124, 58, 237, 0.10),
            transparent 30%
        ),
        radial-gradient(
            circle at 80% 80%,
            rgba(14, 165, 233, 0.08),
            transparent 30%
        ),
        linear-gradient(
            145deg,
            #030712,
            #07111f 50%,
            #030712
        );

    transition:
        opacity 0.8s ease,
        transform 0.8s ease;
}


/* PAGE EXIT */

body.page-exit {
    opacity: 0;
    transform: scale(1.025);
    pointer-events: none;
}


/* =====================================================
   BACKGROUND GLOW
   ===================================================== */

.background-glow {
    position: fixed;

    width: 420px;
    height: 420px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(56, 189, 248, 0.10),
            transparent 68%
        );

    filter: blur(10px);

    pointer-events: none;

    animation:
        ambientGlow
        5s
        ease-in-out
        infinite alternate;
}

@keyframes ambientGlow {

    from {
        transform: scale(0.9);
        opacity: 0.65;
    }

    to {
        transform: scale(1.15);
        opacity: 1;
    }

}


/* =====================================================
   PARTICLES
   ===================================================== */

.particle {
    position: fixed;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background: rgba(56, 189, 248, 0.65);

    box-shadow:
        0 0 10px rgba(56, 189, 248, 0.7);

    pointer-events: none;

    animation:
        floatParticle
        var(--duration)
        ease-in-out
        infinite;
}

.p1 {
    left: 12%;
    top: 24%;
    --duration: 5s;
}

.p2 {
    left: 82%;
    top: 20%;
    --duration: 6s;
}

.p3 {
    left: 20%;
    top: 75%;
    --duration: 7s;
}

.p4 {
    left: 76%;
    top: 72%;
    --duration: 5.5s;
}

.p5 {
    left: 50%;
    top: 13%;
    --duration: 6.5s;
}

@keyframes floatParticle {

    0%,
    100% {
        transform:
            translateY(0)
            scale(1);

        opacity: 0.25;
    }

    50% {
        transform:
            translateY(-25px)
            scale(1.4);

        opacity: 0.9;
    }

}


/* =====================================================
   MAIN SPLASH
   ===================================================== */

.splash {
    position: relative;

    z-index: 5;

    width: min(500px, calc(100% - 36px));

    padding: 38px 25px;

    text-align: center;

    animation:
        splashIn
        1s
        cubic-bezier(.22,1,.36,1)
        forwards;
}

@keyframes splashIn {

    from {
        opacity: 0;
        transform: translateY(18px) scale(0.96);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

}


/* =====================================================
   SHIELD
   ===================================================== */

.logo-wrapper {

    position: relative;

    width: 155px;
    height: 155px;

    margin: 0 auto 25px;

    display: flex;
    align-items: center;
    justify-content: center;
}


/* OUTER GLOW */

.logo-wrapper::before {

    content: "";

    position: absolute;

    inset: 10px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(56, 189, 248, 0.18),
            transparent 65%
        );

    animation:
        logoGlow
        3s
        ease-in-out
        infinite alternate;
}


/* ROTATING RING */

.logo-wrapper::after {

    content: "";

    position: absolute;

    inset: 2px;

    border-radius: 50%;

    border:
        1px solid
        rgba(56, 189, 248, 0.18);

    border-top-color:
        rgba(56, 189, 248, 0.75);

    animation:
        rotateRing
        6s
        linear
        infinite;
}

@keyframes logoGlow {

    from {
        transform: scale(0.9);
        opacity: 0.55;
    }

    to {
        transform: scale(1.1);
        opacity: 1;
    }

}

@keyframes rotateRing {

    to {
        transform: rotate(360deg);
    }

}


/* =====================================================
   SVG SHIELD
   ===================================================== */

.trust-shield {

    position: relative;

    z-index: 2;

    width: 112px;
    height: 112px;

    filter:
        drop-shadow(
            0 0 15px
            rgba(56, 189, 248, 0.45)
        );

    animation:
        shieldPulse
        3s
        ease-in-out
        infinite alternate;
}

@keyframes shieldPulse {

    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.035);
    }

}


/* =====================================================
   BRAND
   ===================================================== */

.brand-name {

    margin: 0;

    font-size: clamp(34px, 8vw, 48px);

    font-weight: 900;

    letter-spacing: -2px;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #93c5fd,
            #38bdf8
        );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;
}

.brand-name span {
    color: #38bdf8;
}


/* =====================================================
   TAGLINE
   ===================================================== */

.tagline {

    margin-top: 7px;

    color: var(--muted);

    font-size: 14px;

    letter-spacing: 1.5px;

    text-transform: uppercase;
}


/* =====================================================
   STATUS
   ===================================================== */

.status-area {

    min-height: 55px;

    margin-top: 28px;

    display: flex;
    align-items: center;
    justify-content: center;
}

.status {

    color: #cbd5e1;

    font-size: 14px;

    transition:
        opacity 0.4s ease,
        transform 0.4s ease;
}

.status.hidden {

    opacity: 0;

    transform: translateY(5px);
}


/* =====================================================
   SECURITY STATE
   ===================================================== */

.security-state {

    margin-top: 18px;

    display: inline-flex;

    align-items: center;

    gap: 8px;

    padding: 7px 13px;

    border:
        1px solid
        rgba(52, 211, 153, 0.20);

    border-radius: 999px;

    background:
        rgba(52, 211, 153, 0.06);

    color: #6ee7b7;

    font-size: 11px;

    font-weight: 800;

    letter-spacing: 0.5px;
}

.security-dot {

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #34d399;

    box-shadow:
        0 0 0 4px
        rgba(52, 211, 153, 0.08),
        0 0 12px
        rgba(52, 211, 153, 0.8);

    animation:
        statusPulse
        1.8s
        infinite;
}

@keyframes statusPulse {

    0%,
    100% {
        opacity: 1;
    }

    50% {
        opacity: 0.4;
    }

}


/* =====================================================
   FOOTER
   ===================================================== */

.footer-text {

    position: fixed;

    bottom: 20px;

    left: 0;
    right: 0;

    text-align: center;

    color: #475569;

    font-size: 11px;

    letter-spacing: 0.5px;
}


/* =====================================================
   MOBILE
   ===================================================== */

@media (max-width: 500px) {

    .logo-wrapper {
        width: 140px;
        height: 140px;
    }

    .trust-shield {
        width: 100px;
        height: 100px;
    }

    .brand-name {
        font-size: 36px;
    }

    .tagline {
        font-size: 12px;
    }

    .status {
        font-size: 13px;
    }
}


/* =====================================================
   REDUCED MOTION
   ===================================================== */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
    }

}

</style>

</head>


<body>


<!-- BACKGROUND -->

<div class="background-glow"></div>

<div class="particle p1"></div>
<div class="particle p2"></div>
<div class="particle p3"></div>
<div class="particle p4"></div>
<div class="particle p5"></div>


<!-- MAIN SPLASH -->

<main class="splash">


    <!-- SHIELD -->

    <div class="logo-wrapper">

        <svg
            class="trust-shield"
            viewBox="0 0 100 100"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
        >

            <defs>

                <linearGradient
                    id="shieldOuter"
                    x1="10"
                    y1="10"
                    x2="90"
                    y2="90"
                >

                    <stop
                        offset="0%"
                        stop-color="#38bdf8"
                    />

                    <stop
                        offset="55%"
                        stop-color="#2563eb"
                    />

                    <stop
                        offset="100%"
                        stop-color="#7c3aed"
                    />

                </linearGradient>


                <linearGradient
                    id="shieldInner"
                    x1="50"
                    y1="10"
                    x2="50"
                    y2="90"
                >

                    <stop
                        offset="0%"
                        stop-color="#172554"
                    />

                    <stop
                        offset="100%"
                        stop-color="#07111f"
                    />

                </linearGradient>

            </defs>


            <!-- OUTER SHIELD -->

            <path
                d="
                M50 5
                L89 18
                V46
                C89 69 72 83 50 94
                C28 83 11 69 11 46
                V18
                L50 5Z
                "
                fill="url(#shieldOuter)"
            />


            <!-- INNER SHIELD -->

            <path
                d="
                M50 11
                L83 22
                V45
                C83 64 69 77 50 87
                C31 77 17 64 17 45
                V22
                L50 11Z
                "
                fill="url(#shieldInner)"
            />


            <!-- AI -->

            <text
                x="50"
                y="51"
                text-anchor="middle"
                dominant-baseline="central"
                font-family="Arial, sans-serif"
                font-size="25"
                font-weight="900"
                letter-spacing="1"
                fill="white"
            >
                AI
            </text>


            <!-- HIGHLIGHT -->

            <circle
                cx="76"
                cy="25"
                r="3"
                fill="#7dd3fc"
                opacity="0.9"
            />

        </svg>

    </div>


    <!-- BRAND -->

    <h1 class="brand-name">
        Trust<span>AI</span>
    </h1>


    <div class="tagline">
        Online Scam Protection
    </div>


    <!-- STATUS -->

    <div class="status-area">

        <div
            class="status"
            id="statusText"
        >
            Initializing secure environment...
        </div>

    </div>


    <!-- SECURITY STATE -->

    <div class="security-state">

        <span class="security-dot"></span>

        Security systems initializing

    </div>


</main>


<!-- FOOTER -->

<div class="footer-text">
    TrustAI • Security Awareness & Protection
</div>


<script>

/* =====================================================
   TRUSTAI SPLASH SEQUENCE
   ===================================================== */

const delay = (ms) =>
    new Promise(resolve => setTimeout(resolve, ms));


async function startTrustAI() {

    const status =
        document.getElementById("statusText");


    /* STEP 1 */

    await delay(1500);

    status.classList.add("hidden");

    await delay(400);

    status.textContent =
        "Checking security environment...";

    status.classList.remove("hidden");


    /* STEP 2 */

    await delay(1600);

    status.classList.add("hidden");

    await delay(400);

    status.textContent =
        "Verifying protection protocols...";

    status.classList.remove("hidden");


    /* STEP 3 */

    await delay(1600);

    status.classList.add("hidden");

    await delay(400);

    status.textContent =
        "Secure connection established.";

    status.classList.remove("hidden");


    /* FINAL PAUSE */

    await delay(1800);


    /* FADE OUT */

    document.body.classList.add("page-exit");


    await delay(900);


/* OPEN LOGIN */

window.location.href = "login.html";

}


/* START */

document.addEventListener(
    "DOMContentLoaded",
    startTrustAI
);

</script>


</body>

</html>
