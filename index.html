<!DOCTYPE html>
<html lang="en">
<head>

<meta name="google-site-verification"
      content="3VSYO-LwkGIdjwjHdyZeFTLnffRQAziBbU-t0P51IJw" />

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Trust AI — Protection Suite</title>

<style>

:root {
    --bg-deep: #020617;
    --blue-primary: #38bdf8;
    --blue-glow: #1d4ed8;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
}

* {
    box-sizing: border-box;
    -webkit-font-smoothing: antialiased;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100vh;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    color: var(--text-main);

    background:
        radial-gradient(
            circle at 50% 30%,
            rgba(29, 78, 216, 0.25),
            transparent 60%
        ),
        #010409;

    transition:
        opacity 0.7s ease,
        transform 0.7s ease;
}

/* PAGE EXIT ANIMATION */

body.page-exit {
    opacity: 0;
    transform: scale(1.02);
    pointer-events: none;
}


/* SPLASH CONTAINER */

.splash-container {
    position: relative;
    z-index: 5;

    width: min(420px, calc(100% - 32px));

    padding: 24px;

    text-align: center;

    background:
        linear-gradient(
            180deg,
            rgba(15, 23, 42, 0.6),
            rgba(2, 6, 23, 0.8)
        );

    border:
        1px solid rgba(56, 189, 248, 0.15);

    border-radius: 28px;

    box-shadow:
        0 25px 50px -12px rgba(0, 0, 0, 0.7),
        0 0 30px rgba(29, 78, 216, 0.15);

    backdrop-filter: blur(12px);
}


/* SHIELD */

.shield-wrapper {
    position: relative;

    width: 120px;
    height: 120px;

    margin: 0 auto 20px;

    display: flex;
    align-items: center;
    justify-content: center;
}

.shield-wrapper::before {
    content: "";

    position: absolute;

    inset: 0;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(56, 189, 248, 0.2),
            transparent 70%
        );

    animation:
        pulseGlow 3s ease-in-out infinite alternate;
}

@keyframes pulseGlow {

    from {
        transform: scale(0.9);
        opacity: 0.5;
    }

    to {
        transform: scale(1.1);
        opacity: 0.9;
    }

}

.trust-shield {
    width: 90px;
    height: 90px;

    filter:
        drop-shadow(
            0 0 12px rgba(56, 189, 248, 0.5)
        );
}


/* BRAND */

.brand-title {
    margin: 0;

    font-size: 22px;
    font-weight: 800;

    letter-spacing: 0.5px;

    color: #ffffff;
}

.brand-subtitle {
    margin-top: 8px;

    color: var(--text-muted);

    font-size: 11px;
    font-weight: 600;

    letter-spacing: 1.5px;

    text-transform: uppercase;

    line-height: 1.4;
}


/* ACCESS */

.secure-options {
    margin-top: 32px;
}

.secure-options a {

    color: var(--text-muted);

    font-size: 11px;

    text-decoration: none;

    letter-spacing: 0.8px;

    text-transform: uppercase;

    border-bottom:
        1px dotted
        rgba(148, 163, 184, 0.4);

    padding-bottom: 2px;

    transition:
        color 0.2s ease;
}

.secure-options a:hover {
    color: var(--blue-primary);
}


/* LOADING TEXT */

.loading-text {

    margin-top: 18px;

    color: rgba(148, 163, 184, 0.65);

    font-size: 9px;

    letter-spacing: 1px;

    text-transform: uppercase;
}

</style>

</head>

<body>

<main class="splash-container">

    <div class="shield-wrapper">

        <svg
            class="trust-shield"
            viewBox="0 0 100 100"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
        >

            <defs>

                <linearGradient
                    id="shieldGrad"
                    x1="10"
                    y1="10"
                    x2="90"
                    y2="90"
                >

                    <stop
                        offset="0%"
                        stop-color="#38bdf8"
                    />

                    <stop
                        offset="100%"
                        stop-color="#1d4ed8"
                    />

                </linearGradient>

            </defs>


            <path
                d="
                    M50 5
                    L89 18
                    V46
                    C89 69 72 83 50 94
                    C28 83 11 69 11 46
                    V18
                    L50 5Z
                "
                fill="url(#shieldGrad)"
                fill-opacity="0.2"
                stroke="#38bdf8"
                stroke-width="2"
            />


            <path
                d="
                    M50 15
                    L79 25
                    V45
                    C79 61 67 72 50 81
                    C33 72 21 61 21 45
                    V25
                    L50 15Z
                "
                stroke="#38bdf8"
                stroke-width="1"
                stroke-dasharray="2 2"
            />


            <text
                x="50"
                y="52"
                text-anchor="middle"
                dominant-baseline="central"
                font-family="Arial, sans-serif"
                font-size="20"
                font-weight="900"
                fill="white"
            >
                AI
            </text>

        </svg>

    </div>


    <h1 class="brand-title">
        TRUST AI PROTECTION SUITE
    </h1>


    <div class="brand-subtitle">
        Intelligence Platform for<br>
        Digital Safety & Verification.
    </div>


    <div class="secure-options">

        <a href="login.html" id="loginLink">
            Secure Access Options
        </a>

    </div>


    <div class="loading-text">
        Securing your connection...
    </div>

</main>


<script>

/* =========================================
   TRUST AI SPLASH → LOGIN
========================================= */

const loginPage = "login.html";

const loginLink =
    document.getElementById("loginLink");


/*
   When the user taps
   "Secure Access Options",
   play the exit animation
   before opening login.html.
*/

loginLink.addEventListener("click", function(event) {

    event.preventDefault();

    document.body.classList.add("page-exit");

    setTimeout(function() {

        window.location.href = loginPage;

    }, 700);

});


/*
   AUTOMATIC REDIRECT

   The splash screen stays visible
   for 3 seconds and then carries
   the user to login.html.
*/

setTimeout(function() {

    document.body.classList.add("page-exit");

    setTimeout(function() {

        window.location.href = loginPage;

    }, 700);

}, 3000);

</script>

</body>
</html>
