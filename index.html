<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trust AI | Initializing Security Protocols</title>
  
  <style>
    /* ================================
       CSS Variables & Reset
       ================================ */
    :root {
      --bg-color: #0b0f19;
      --text-color: #f3f4f6;
      --text-muted: #9ca3af;
      --primary-color: #3b82f6;
      --primary-glow: rgba(59, 130, 246, 0.45);
      --font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ================================
       Global Styles & Exit Transition
       ================================ */
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      opacity: 1;
      transition: opacity 0.5s ease-in-out;
    }

    /* Triggered via JS right before page redirection */
    body.page-exit {
      opacity: 0;
      pointer-events: none;
    }

    /* ================================
       Top Progress Bar Track
       ================================ */
    .progress-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background-color: rgba(255, 255, 255, 0.05);
      z-index: 1000;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #2563eb, var(--primary-color));
      box-shadow: 0 0 12px var(--primary-glow);
      /* Smooth cubic-bezier timing curve */
      transition: width 3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* ================================
       Splash Card / Screen Content
       ================================ */
    .brand-container {
      text-align: center;
      padding: 2rem;
      max-width: 420px;
      width: 90%;
      animation: fadeIn 0.8s ease-out forwards;
    }

    /* Custom Shield Graphic Styling */
    .brand-logo {
      width: 150px;
      height: auto;
      margin-bottom: 1rem;
      /* Adds dynamic ambient glow behind shield */
      filter: drop-shadow(0 0 20px rgba(59, 130, 246, 0.5));
      user-select: none;
    }

    .brand-title {
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.6rem;
    }

    .brand-subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <!-- Top Progress Bar Container -->
  <div class="progress-container">
    <div 
      class="progress-bar" 
      id="progressBar" 
      role="progressbar" 
      aria-valuenow="0" 
      aria-valuemin="0" 
      aria-valuemax="100"
      aria-label="Establishing connection"
    ></div>
  </div>

  <!-- Main Center Content -->
  <main class="brand-container">
    <!-- Replace "logo.png" with the path/filename of your saved shield image -->
    <img src="logo.png" alt="Trust AI Shield Logo" class="brand-logo" />
    
    <h1 class="brand-title">Establishing Secure Connection</h1>
    <p class="brand-subtitle">Verifying system integrity and loading Trust AI environment...</p>
  </main>

  <!-- Optimized Async Script -->
  <script>
    // Promise utility helper
    const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    async function handlePageTransition() {
      const progressBar = document.getElementById("progressBar");
      if (!progressBar) return;

      // Initial short pause before progress animation begins
      await delay(400);

      // Trigger progress growth
      progressBar.style.width = "100%";
      progressBar.setAttribute("aria-valuenow", "100");

      // Wait for progress bar to finish filling + hold view
      await delay(3200);

      // Fade out screen
      document.body.classList.add("page-exit");

      // Redirect after fade completes
      await delay(500);
      window.location.href = "home.html";
    }

    // Execute flow when DOM is ready
    document.addEventListener("DOMContentLoaded", handlePageTransition);
  </script>

</body>
</html>
