<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>TrustAI</title>

<style>

/* =====================================================
   TRUSTAI — PREMIUM SECURITY APPLICATION
   ===================================================== */

:root {
    --bg: #050b16;
    --blue: #38bdf8;
    --blue-dark: #2563eb;
    --purple: #7c3aed;
    --text: #f8fafc;
    --muted: #94a3b8;
}


/* RESET */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow-x: hidden;

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    color: var(--text);

    background:
        radial-gradient(
            circle at 50% 42%,
            rgba(37, 99, 235, 0.18),
            transparent 25%
        ),
        radial-gradient(
            circle at 20% 20%,
            rgba(124, 58, 237, 0.10),
            transparent 30%
        ),
        radial-gradient(
            circle at 80% 80%,
            rgba(14, 165, 233, 0.08),
            transparent 30%
        ),
        linear-gradient(
            145deg,
            #030712,
            #07111f 50%,
            #030712
        );

    transition:
        opacity 0.8s ease,
        transform 0.8s ease;
}


/* =====================================================
   BACKGROUND GLOW & PARTICLES
   ===================================================== */

.background-glow {
    position: fixed;

    width: 420px;
    height: 420px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(56, 189, 248, 0.10),
            transparent 68%
        );

    filter: blur(10px);

    pointer-events: none;

    animation:
        ambientGlow
        5s
        ease-in-out
        infinite alternate;
}

@keyframes ambientGlow {

    from {
        transform: scale(0.9);
        opacity: 0.65;
    }

    to {
        transform: scale(1.15);
        opacity: 1;
    }

}

.particle {
    position: fixed;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background: rgba(56, 189, 248, 0.65);

    box-shadow:
        0 0 10px rgba(56, 189, 248, 0.7);

    pointer-events: none;

    animation:
        floatParticle
        var(--duration)
        ease-in-out
        infinite;
}

.p1 { left: 12%; top: 24%; --duration: 5s; }
.p2 { left: 82%; top: 20%; --duration: 6s; }
.p3 { left: 20%; top: 75%; --duration: 7s; }
.p4 { left: 76%; top: 72%; --duration: 5.5s; }
.p5 { left: 50%; top: 13%; --duration: 6.5s; }

@keyframes floatParticle {
    0%, 100% {
        transform: translateY(0) scale(1);
        opacity: 0.25;
    }
    50% {
        transform: translateY(-25px) scale(1.4);
        opacity: 0.9;
    }
}


/* =====================================================
   MAIN CONTAINER & SPLASH
   ===================================================== */

.splash {
    position: relative;

    z-index: 5;

    width: min(480px, calc(100% - 36px));

    padding: 30px 20px;

    text-align: center;

    animation:
        splashIn
        1s
        cubic-bezier(.22,1,.36,1)
        forwards;
}

@keyframes splashIn {

    from {
        opacity: 0;
        transform: translateY(18px) scale(0.96);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

}


/* =====================================================
   SHIELD & BRAND
   ===================================================== */

.logo-wrapper {
    position: relative;
    width: 120px;
    height: 120px;
    margin: 0 auto 15px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.logo-wrapper::before {
    content: "";
    position: absolute;
    inset: 10px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(56, 189, 248, 0.18), transparent 65%);
    animation: logoGlow 3s ease-in-out infinite alternate;
}

.logo-wrapper::after {
    content: "";
    position: absolute;
    inset: 2px;
    border-radius: 50%;
    border: 1px solid rgba(56, 189, 248, 0.18);
    border-top-color: rgba(56, 189, 248, 0.75);
    animation: rotateRing 6s linear infinite;
}

@keyframes logoGlow {
    from { transform: scale(0.9); opacity: 0.55; }
    to { transform: scale(1.1); opacity: 1; }
}

@keyframes rotateRing {
    to { transform: rotate(360deg); }
}

.trust-shield {
    position: relative;
    z-index: 2;
    width: 85px;
    height: 85px;
    filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.45));
    animation: shieldPulse 3s ease-in-out infinite alternate;
}

@keyframes shieldPulse {
    from { transform: scale(1); }
    to { transform: scale(1.035); }
}

.brand-name {
    margin: 0;
    font-size: clamp(32px, 7vw, 42px);
    font-weight: 900;
    letter-spacing: -1.5px;
    background: linear-gradient(135deg, #ffffff, #93c5fd, #38bdf8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.brand-name span {
    color: #38bdf8;
}

.tagline {
    margin-top: 4px;
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
}


/* =====================================================
   INITIALIZATION STATUS
   ===================================================== */

.status-area {
    min-height: 45px;
    margin-top: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.status {
    color: #cbd5e1;
    font-size: 14px;
    transition: opacity 0.4s ease, transform 0.4s ease;
}

.status.hidden {
    opacity: 0;
    transform: translateY(5px);
}

.security-state {
    margin-top: 12px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border: 1px solid rgba(52, 211, 153, 0.20);
    border-radius: 999px;
    background: rgba(52, 211, 153, 0.06);
    color: #6ee7b7;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.5px;
}

.security-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #34d399;
    box-shadow: 0 0 0 4px rgba(52, 211, 153, 0.08), 0 0 12px rgba(52, 211, 153, 0.8);
    animation: statusPulse 1.8s infinite;
}

@keyframes statusPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
}


/* =====================================================
   AUTHENTICATION FORM CARD
   ===================================================== */

.auth-card {
    margin-top: 25px;
    padding: 24px 20px;
    border-radius: 16px;
    background: rgba(15, 23, 42, 0.75);
    border: 1px solid rgba(56, 189, 248, 0.2);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(12px);
    display: flex;
    flex-direction: column;
    gap: 14px;
    animation: splashIn 0.6s cubic-bezier(.22,1,.36,1) forwards;
}

.form-toggle {
    display: flex;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    margin-bottom: 8px;
}

.tab-btn {
    flex: 1;
    padding: 10px;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
}

.tab-btn.active {
    color: var(--blue);
    border-bottom: 2px solid var(--blue);
}

.auth-form {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.input-field {
    width: 100%;
    padding: 12px 16px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(3, 7, 18, 0.6);
    color: #fff;
    font-size: 14px;
    outline: none;
    transition: border-color 0.3s ease;
}

.input-field:focus {
    border-color: var(--blue);
}

.submit-btn {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--blue-dark), var(--blue));
    color: #fff;
    font-weight: 800;
    font-size: 14px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
    transition: transform 0.2s ease, opacity 0.2s ease;
}

.submit-btn:active {
    transform: scale(0.98);
}

.user-session-card {
    margin-top: 25px;
    padding: 24px 20px;
    border-radius: 16px;
    background: rgba(15, 23, 42, 0.85);
    border: 1px solid rgba(52, 211, 153, 0.3);
    text-align: center;
}

/* FOOTER */

.footer-text {
    position: fixed;
    bottom: 20px;
    left: 0;
    right: 0;
    text-align: center;
    color: #475569;
    font-size: 11px;
    letter-spacing: 0.5px;
}

</style>

</head>


<body>

<!-- BACKGROUND -->
<div class="background-glow"></div>

<div class="particle p1"></div>
<div class="particle p2"></div>
<div class="particle p3"></div>
<div class="particle p4"></div>
<div class="particle p5"></div>

<!-- MAIN CONTAINER -->
<main class="splash">

    <!-- SHIELD -->
    <div class="logo-wrapper">
        <svg class="trust-shield" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="shieldOuter" x1="10" y1="10" x2="90" y2="90">
                    <stop offset="0%" stop-color="#38bdf8"/>
                    <stop offset="55%" stop-color="#2563eb"/>
                    <stop offset="100%" stop-color="#7c3aed"/>
                </linearGradient>
                <linearGradient id="shieldInner" x1="50" y1="10" x2="50" y2="90">
                    <stop offset="0%" stop-color="#172554"/>
                    <stop offset="100%" stop-color="#07111f"/>
                </linearGradient>
            </defs>
            <path d="M50 5 L89 18 V46 C89 69 72 83 50 94 C28 83 11 69 11 46 V18 L50 5Z" fill="url(#shieldOuter)"/>
            <path d="M50 11 L83 22 V45 C83 64 69 77 50 87 C31 77 17 64 17 45 V22 L50 11Z" fill="url(#shieldInner)"/>
            <text x="50" y="51" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="25" font-weight="900" letter-spacing="1" fill="white">AI</text>
            <circle cx="76" cy="25" r="3" fill="#7dd3fc" opacity="0.9"/>
        </svg>
    </div>

    <!-- BRAND -->
    <h1 class="brand-name">Trust<span>AI</span></h1>
    <div class="tagline">Online Scam Protection</div>

    <!-- INITIAL SPLASH STATUS -->
    <div id="init-section">
        <div class="status-area">
            <div class="status" id="statusText">Initializing secure environment...</div>
        </div>

        <div class="security-state">
            <span class="security-dot"></span>
            Security systems active
        </div>
    </div>

    <!-- AUTHENTICATION CONTAINER -->
    <div id="auth-container" class="auth-card" style="display: none;">
        <div class="form-toggle">
            <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Log In</button>
            <button class="tab-btn" id="tab-signup" onclick="switchTab('signup')">Create Account</button>
        </div>

        <!-- LOGIN FORM -->
        <form id="login-form" class="auth-form" onsubmit="handleLogin(event)">
            <input type="email" id="login-email" class="input-field" placeholder="Email Address" required />
            <input type="password" id="login-password" class="input-field" placeholder="Password" required />
            <button type="submit" class="submit-btn">Access Security Portal</button>
        </form>

        <!-- SIGN UP FORM -->
        <form id="signup-form" class="auth-form" style="display: none;" onsubmit="handleSignUp(event)">
            <input type="email" id="signup-email" class="input-field" placeholder="Email Address" required />
            <input type="password" id="signup-password" class="input-field" placeholder="Create Password" required />
            <button type="submit" class="submit-btn">Register Account</button>
        </form>
    </div>

    <!-- USER LOGGED IN STATE -->
    <div id="user-status" class="user-session-card" style="display: none;">
        <p style="margin: 0 0 12px 0; color: #6ee7b7; font-weight: 700;">
            ✓ Logged in as: <span id="user-email-display" style="color: #fff;"></span>
        </p>
        <button onclick="handleLogout()" class="submit-btn" style="background: rgba(239, 68, 68, 0.8);">Log Out</button>
    </div>

</main>

<!-- FOOTER -->
<div class="footer-text">
    TrustAI • Security Awareness & Protection
</div>

<!-- SUPABASE JS LIBRARY -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* =====================================================
   SUPABASE CONFIGURATION
   ===================================================== */
const SUPABASE_URL = "https://xbsurdlaixeynaxarqma.supabase.co";
const SUPABASE_ANON_KEY = "Sb_publishable_C5gmKnTVYqNDhLD2zIikwg_lQFxPNL7";

const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* =====================================================
   INITIALIZATION SEQUENCE
   ===================================================== */
const delay = (ms) => new Promise(resolve => setTimeout(resolve, ms));

async function startTrustAI() {
    const status = document.getElementById("statusText");

    await delay(1200);
    status.classList.add("hidden");
    await delay(300);
    status.textContent = "Checking security environment...";
    status.classList.remove("hidden");

    await delay(1200);
    status.classList.add("hidden");
    await delay(300);
    status.textContent = "Verifying protection protocols...";
    status.classList.remove("hidden");

    await delay(1200);
    status.classList.add("hidden");
    await delay(300);
    status.textContent = "Secure connection established.";
    status.classList.remove("hidden");

    await delay(1000);
    
    document.getElementById("init-section").style.display = "none";
    checkUserSession();
}

/* =====================================================
   AUTHENTICATION LOGIC
   ===================================================== */
function switchTab(type) {
    const loginForm = document.getElementById("login-form");
    const signupForm = document.getElementById("signup-form");
    const tabLogin = document.getElementById("tab-login");
    const tabSignup = document.getElementById("tab-signup");

    if (type === 'login') {
        loginForm.style.display = "flex";
        signupForm.style.display = "none";
        tabLogin.classList.add("active");
        tabSignup.classList.remove("active");
    } else {
        loginForm.style.display = "none";
        signupForm.style.display = "flex";
        tabSignup.classList.add("active");
        tabLogin.classList.remove("active");
    }
}

async function handleSignUp(event) {
    event.preventDefault();
    const email = document.getElementById("signup-email").value;
    const password = document.getElementById("signup-password").value;

    const { data, error } = await supabase.auth.signUp({ email, password });

    if (error) {
        alert("Registration failed: " + error.message);
    } else {
        alert("Account created successfully! Check your email for confirmation.");
        checkUserSession();
    }
}

async function handleLogin(event) {
    event.preventDefault();
    const email = document.getElementById("login-email").value;
    const password = document.getElementById("login-password").value;

    const { data, error } = await supabase.auth.signInWithPassword({ email, password });

    if (error) {
        alert("Login failed: " + error.message);
    } else {
        alert("Welcome back to TrustAI!");
        checkUserSession();
    }
}

async function handleLogout() {
    await supabase.auth.signOut();
    location.reload();
}

async function checkUserSession() {
    const { data: { session } } = await supabase.auth.getSession();
    const authContainer = document.getElementById("auth-container");
    const userStatus = document.getElementById("user-status");

    if (session) {
        authContainer.style.display = "none";
        userStatus.style.display = "block";
        document.getElementById("user-email-display").textContent = session.user.email;
    } else {
        authContainer.style.display = "flex";
        userStatus.style.display = "none";
    }
}

document.addEventListener("DOMContentLoaded", startTrustAI);
</script>

</body>
</html>
