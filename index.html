<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trust AI | Initializing Security Protocols</title>
  
  <style>
    /* ================================
       CSS Variables & Reset
       ================================ */
    :root {
      --bg-color: #080c14;
      --text-color: #f3f4f6;
      --text-muted: #9ca3af;
      --primary-color: #3b82f6;
      --primary-glow: rgba(59, 130, 246, 0.45);
      --font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ================================
       Global Styles & Canvas Background
       ================================ */
    body {
      background-color: var(--bg-color);
      /* Radial ambient glow in center screen */
      background-image: radial-gradient(circle at 50% 45%, rgba(59, 130, 246, 0.12) 0%, transparent 60%);
      color: var(--text-color);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      opacity: 1;
      transition: opacity 0.5s ease-in-out;
    }

    /* Smooth Page Exit */
    body.page-exit {
      opacity: 0;
      pointer-events: none;
    }

    /* ================================
       Top Progress Bar Track & Percentage
       ================================ */
    .progress-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background-color: rgba(255, 255, 255, 0.05);
      z-index: 1000;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #2563eb, var(--primary-color));
      box-shadow: 0 0 14px var(--primary-glow);
      transition: width 3.2s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Minimalist percentage counter badge in top corner */
    .status-badge {
      position: fixed;
      top: 12px;
      right: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--primary-color);
      opacity: 0.8;
      font-family: monospace;
    }

    /* ================================
       Splash Card & SVG Logo Styling
       ================================ */
    .brand-container {
      text-align: center;
      padding: 2rem;
      max-width: 440px;
      width: 90%;
      animation: fadeIn 0.8s ease-out forwards;
    }

    /* SVG Shield Logo Container & Pulse */
    .logo-wrapper {
      margin-bottom: 1.25rem;
      display: inline-block;
    }

    .trust-ai-shield {
      width: 140px;
      height: 140px;
      filter: drop-shadow(0 0 25px rgba(59, 130, 246, 0.5));
      animation: pulseGlow 3s ease-in-out infinite alternate;
    }

    .brand-title {
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.6rem;
    }

    .brand-subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.5;
      min-height: 2.8em;
      transition: opacity 0.3s ease;
    }

    /* Keyframe Animations */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulseGlow {
      from {
        filter: drop-shadow(0 0 18px rgba(59, 130, 246, 0.4));
        transform: scale(1);
      }
      to {
        filter: drop-shadow(0 0 32px rgba(59, 130, 246, 0.8));
        transform: scale(1.03);
      }
    }
  </style>
</head>
<body>

  <!-- Top Progress Bar Container -->
  <div class="progress-container">
    <div 
      class="progress-bar" 
      id="progressBar" 
      role="progressbar" 
      aria-valuenow="0" 
      aria-valuemin="0" 
      aria-valuemax="100"
      aria-label="Establishing connection"
    ></div>
  </div>

  <!-- Real-time Loading Percentage -->
  <div class="status-badge" id="statusBadge">0%</div>

  <!-- Main Content -->
  <main class="brand-container">
    
    <!-- PURE SVG LOGO CODE (Replaces logo.png completely) -->
    <div class="logo-wrapper">
      <svg class="trust-ai-shield" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Outer Border Glow Gradient -->
          <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="100%" stop-color="#1d4ed8" />
          </linearGradient>

          <!-- Inner Shield Body Gradient -->
          <linearGradient id="shield-body" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%" stop-color="#1e40af" />
            <stop offset="100%" stop-color="#0f172a" />
          </linearGradient>
        </defs>

        <!-- Outer Glowing Cyan Shield Border -->
        <path d="M50 5 L88 18 V48 C88 70 50 92 50 92 C50 92 12 70 12 48 V18 L50 5 Z" 
              fill="url(#cyan-glow)" />

        <!-- Inner Dark Blue Shield Body -->
        <path d="M50 10 L83 21 V47 C83 66 50 86 50 86 C50 86 17 66 17 47 V21 L50 10 Z" 
              fill="url(#shield-body)" />

        <!-- Bold White "AI" Text -->
        <text x="50" y="52" 
              font-family="-apple-system, BlinkMacSystemFont, sans-serif" 
              font-size="28" 
              font-weight="900" 
              fill="#ffffff" 
              text-anchor="middle" 
              dominant-baseline="central" 
              letter-spacing="1">AI</text>
      </svg>
    </div>
    
    <h1 class="brand-title">Establishing Secure Connection</h1>
    <p class="brand-subtitle" id="statusText">Initializing Trust AI environment...</p>
  </main>

  <!-- Dynamic Async Execution -->
  <script>
    const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    async function handlePageTransition() {
      const progressBar = document.getElementById("progressBar");
      const statusBadge = document.getElementById("statusBadge");
      const statusText = document.getElementById("statusText");

      if (!progressBar) return;

      // Phase 1: Start Progress Growth
      await delay(300);
      progressBar.style.width = "100%";
      progressBar.setAttribute("aria-valuenow", "100");

      // Animate percentage counter in sync with progress
      let currentProgress = 0;
      const counterInterval = setInterval(() => {
        if (currentProgress < 100) {
          currentProgress += 1;
          statusBadge.textContent = `${currentProgress}%`;
        } else {
          clearInterval(counterInterval);
        }
      }, 30);

      // Phase 2: Dynamic status text updates
      await delay(1200);
      statusText.style.opacity = "0";
      await delay(300);
      statusText.textContent = "Verifying security protocols & system integrity...";
      statusText.style.opacity = "1";

      await delay(1300);
      statusText.style.opacity = "0";
      await delay(300);
      statusText.textContent = "Connection secure. Redirecting...";
      statusText.style.opacity = "1";

      // Phase 3: Hold & Fade Out
      await delay(600);
      document.body.classList.add("page-exit");

      // Phase 4: Redirect
      await delay(500);
      window.location.href = "home.html";
    }

    document.addEventListener("DOMContentLoaded", handlePageTransition);
  </script>

</body>
</html>
