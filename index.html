<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>TrustAI — Online Scam Protection</title>

<style>

/* =====================================================
   TRUSTAI — PREMIUM SPLASH / INDEX PAGE
   ===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    margin: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    color: #f8fafc;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(56, 189, 248, 0.18),
            transparent 30%
        ),
        radial-gradient(
            circle at 80% 80%,
            rgba(99, 102, 241, 0.18),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #030712,
            #071426,
            #0a1024
        );
}


/* =====================================================
   BACKGROUND EFFECT
   ===================================================== */

.background-glow {
    position: fixed;
    inset: 0;

    pointer-events: none;

    background:
        linear-gradient(
            rgba(255,255,255,0.018) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,0.018) 1px,
            transparent 1px
        );

    background-size: 42px 42px;

    mask-image:
        linear-gradient(
            to bottom,
            black,
            transparent
        );
}


/* =====================================================
   SPLASH
   ===================================================== */

.splash {
    position: relative;
    z-index: 2;

    width: min(440px, calc(100% - 40px));

    padding: 45px 30px;

    text-align: center;

    border: 1px solid rgba(148, 163, 184, 0.14);

    border-radius: 30px;

    background:
        linear-gradient(
            145deg,
            rgba(15, 31, 52, 0.88),
            rgba(5, 15, 28, 0.92)
        );

    box-shadow:
        0 30px 90px rgba(0,0,0,0.45),
        0 0 60px rgba(56,189,248,0.06);

    backdrop-filter: blur(18px);

    animation:
        splashIn 0.8s ease forwards;
}

@keyframes splashIn {

    from {
        opacity: 0;
        transform: translateY(20px) scale(0.96);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

}


/* =====================================================
   SHIELD
   ===================================================== */

.shield-container {

    width: 120px;
    height: 120px;

    margin: 0 auto 25px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 34px;

    background:
        linear-gradient(
            135deg,
            rgba(56,189,248,0.18),
            rgba(37,99,235,0.10)
        );

    border: 1px solid
        rgba(56,189,248,0.30);

    box-shadow:
        0 0 35px rgba(56,189,248,0.16),
        inset 0 0 25px rgba(56,189,248,0.05);

    animation:
        shieldFloat 3s ease-in-out infinite;
}

@keyframes shieldFloat {

    0%,
    100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-7px);
    }

}

.shield {
    font-size: 70px;

    filter:
        drop-shadow(
            0 0 18px
            rgba(56,189,248,0.55)
        );
}


/* =====================================================
   BRAND
   ===================================================== */

.name {

    margin: 0;

    font-size: clamp(38px, 10vw, 52px);

    font-weight: 900;

    letter-spacing: -2px;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #7dd3fc,
            #60a5fa
        );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;
}

.tagline {

    margin-top: 8px;

    color: #94a3b8;

    font-size: 14px;

    letter-spacing: 1.5px;

    text-transform: uppercase;
}


/* =====================================================
   STATUS
   ===================================================== */

.status {

    display: inline-flex;

    align-items: center;

    gap: 8px;

    margin-top: 25px;

    padding: 8px 13px;

    border-radius: 999px;

    border: 1px solid
        rgba(52,211,153,0.22);

    background:
        rgba(52,211,153,0.06);

    color: #6ee7b7;

    font-size: 11px;

    font-weight: 800;

    letter-spacing: 0.5px;
}

.status-dot {

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #34d399;

    box-shadow:
        0 0 0 4px
        rgba(52,211,153,0.08),

        0 0 14px
        rgba(52,211,153,0.8);

    animation:
        pulse 1.8s infinite;
}

@keyframes pulse {

    0%,
    100% {
        opacity: 1;
    }

    50% {
        opacity: 0.4;
    }

}


/* =====================================================
   LOADING
   ===================================================== */

.loading {

    margin-top: 30px;
}

.loading-text {

    margin-bottom: 9px;

    color: #64748b;

    font-size: 11px;

    text-align: left;
}

.progress {

    width: 100%;
    height: 5px;

    overflow: hidden;

    border-radius: 999px;

    background:
        rgba(148,163,184,0.10);
}

.progress-bar {

    width: 0%;
    height: 100%;

    border-radius: inherit;

    background:
        linear-gradient(
            90deg,
            #0ea5e9,
            #2563eb,
            #7c3aed
        );

    box-shadow:
        0 0 15px
        rgba(56,189,248,0.5);

    animation:
        loading 2s linear forwards;
}

@keyframes loading {

    from {
        width: 0%;
    }

    to {
        width: 100%;
    }

}


/* =====================================================
   FOOTER
   ===================================================== */

.footer {

    margin-top: 25px;

    color: #475569;

    font-size: 11px;
}

.footer span {
    color: #64748b;
}


/* =====================================================
   MOBILE
   ===================================================== */

@media (max-width: 500px) {

    .splash {

        width: calc(100% - 28px);

        padding:
            38px 22px;

        border-radius: 25px;
    }

    .shield-container {

        width: 105px;
        height: 105px;

        border-radius: 29px;
    }

    .shield {

        font-size: 62px;
    }

    .name {

        font-size: 40px;
    }

    .tagline {

        font-size: 11px;

        letter-spacing: 1.2px;
    }

}


/* =====================================================
   REDUCED MOTION
   ===================================================== */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {

        animation-duration: 0.01ms !important;

        animation-iteration-count: 1 !important;

        scroll-behavior: auto !important;
    }

}

</style>

</head>


<body>


<div class="background-glow"></div>


<main class="splash">


    <div class="shield-container">

        <div class="shield">
            🛡️
        </div>

    </div>


    <h1 class="name">
        TrustAI
    </h1>


    <div class="tagline">
        Online Scam Protection
    </div>


    <div class="status">

        <span class="status-dot"></span>

        Security system ready

    </div>


    <div class="loading">

        <div class="loading-text">
            Preparing TrustAI...
        </div>

        <div class="progress">

            <div class="progress-bar"></div>

        </div>

    </div>


    <div class="footer">

        <span>Stay alert.</span>
        Stay protected.

    </div>


</main>


<script>

/* =====================================================
   REDIRECT TO HOME
   ===================================================== */

setTimeout(function() {

    window.location.href = "home.html";

}, 2000);

</script>


</body>

</html>
