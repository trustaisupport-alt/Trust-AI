<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TrustAI — Language</title>

<meta
    name="description"
    content="Choose your preferred TrustAI language."
>

<style>

/* ============================================================
   TRUSTAI LANGUAGE PAGE
============================================================ */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at 15% 0%,
            rgba(59,130,246,.14),
            transparent 35%
        ),
        radial-gradient(
            circle at 90% 20%,
            rgba(124,92,255,.11),
            transparent 35%
        ),
        #050b14;

    color: #f8fafc;
}


/* ============================================================
   PAGE
============================================================ */

.page {
    width: min(760px, calc(100% - 24px));

    margin: auto;

    padding: 22px 0 45px;
}


/* ============================================================
   HEADER
============================================================ */

.header {
    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 45px;
}

.back-button {
    width: 44px;
    height: 44px;

    border: 1px solid #263b52;

    border-radius: 12px;

    background: #0b1726;

    color: white;

    font-size: 21px;

    cursor: pointer;

    transition: .2s;
}

.back-button:hover {
    border-color: #3b82f6;

    transform: translateY(-1px);
}

.logo {
    font-size: 22px;

    font-weight: 900;
}

.logo span {
    color: #60a5fa;
}

.header-spacer {
    width: 44px;
}


/* ============================================================
   HERO
============================================================ */

.hero {
    text-align: center;

    margin-bottom: 30px;
}

.hero-badge {
    display: inline-flex;

    padding: 7px 13px;

    border: 1px solid #24466a;

    border-radius: 999px;

    background: rgba(59,130,246,.08);

    color: #7db5ff;

    font-size: 11px;

    font-weight: 800;

    letter-spacing: .5px;
}

.hero h1 {
    margin: 17px 0 10px;

    font-size: clamp(34px, 8vw, 48px);

    line-height: 1.05;

    letter-spacing: -1.5px;
}

.hero p {
    max-width: 600px;

    margin: auto;

    color: #8fa5bd;

    font-size: 14px;

    line-height: 1.65;
}


/* ============================================================
   LANGUAGE CARD
============================================================ */

.language-card {
    padding: 22px;

    border: 1px solid #263b52;

    border-radius: 20px;

    background: #0b1726;

    box-shadow:
        0 20px 50px rgba(0,0,0,.25);
}


/* ============================================================
   CURRENT LANGUAGE
============================================================ */

.current-language {
    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;

    margin-bottom: 22px;

    padding: 16px;

    border: 1px solid #29445f;

    border-radius: 15px;

    background: #0f1e30;
}

.current-left {
    display: flex;

    align-items: center;

    gap: 12px;
}

.current-flag {
    font-size: 28px;
}

.current-label {
    color: #8197ad;

    font-size: 11px;

    font-weight: 700;

    text-transform: uppercase;

    letter-spacing: .5px;
}

.current-name {
    margin-top: 3px;

    font-size: 15px;

    font-weight: 900;
}

.current-status {
    padding: 6px 9px;

    border: 1px solid #315d8c;

    border-radius: 999px;

    background: rgba(59,130,246,.10);

    color: #7db5ff;

    font-size: 9px;

    font-weight: 900;
}


/* ============================================================
   SEARCH
============================================================ */

.search-box {
    margin-bottom: 18px;
}

.search-input {
    width: 100%;

    padding: 14px 15px;

    border: 1px solid #263b52;

    border-radius: 12px;

    outline: none;

    background: #07111d;

    color: white;

    font-family: inherit;

    font-size: 13px;

    transition: .2s;
}

.search-input::placeholder {
    color: #60758b;
}

.search-input:focus {
    border-color: #3b82f6;

    box-shadow:
        0 0 0 3px rgba(59,130,246,.10);
}


/* ============================================================
   LANGUAGE LIST
============================================================ */

.language-list {
    display: grid;

    grid-template-columns: repeat(2, 1fr);

    gap: 10px;
}

.language-option {
    width: 100%;

    display: flex;

    align-items: center;

    gap: 12px;

    padding: 14px;

    border: 1px solid #263b52;

    border-radius: 14px;

    background: #07111d;

    color: white;

    text-align: left;

    cursor: pointer;

    transition: .2s;
}

.language-option:hover {
    border-color: #3b82f6;

    background: #0c1b2d;

    transform: translateY(-1px);
}

.language-option.selected {
    border-color: #3b82f6;

    background:
        rgba(59,130,246,.10);

    box-shadow:
        0 0 0 1px rgba(59,130,246,.12);
}

.language-flag {
    width: 38px;
    height: 38px;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-shrink: 0;

    border-radius: 11px;

    background: #13283f;

    font-size: 21px;
}

.language-text {
    min-width: 0;
}

.language-name {
    font-size: 14px;

    font-weight: 900;
}

.language-native {
    margin-top: 3px;

    color: #8197ad;

    font-size: 11px;
}

.language-check {
    width: 22px;
    height: 22px;

    display: flex;

    align-items: center;
    justify-content: center;

    margin-left: auto;

    flex-shrink: 0;

    border: 1px solid #38536e;

    border-radius: 50%;

    color: transparent;

    font-size: 12px;

    font-weight: 900;
}

.language-option.selected
.language-check {
    background: #3b82f6;

    border-color: #3b82f6;

    color: white;
}


/* ============================================================
   NOTICE
============================================================ */

.notice {
    margin-top: 18px;

    padding: 16px;

    border: 1px solid #263b52;

    border-radius: 15px;

    background: rgba(11,23,38,.75);

    color: #8197ad;

    font-size: 11px;

    line-height: 1.6;

    text-align: center;
}


/* ============================================================
   EMPTY SEARCH
============================================================ */

.no-results {
    display: none;

    padding: 25px;

    color: #8197ad;

    font-size: 13px;

    text-align: center;
}


/* ============================================================
   FOOTER
============================================================ */

footer {
    margin-top: 40px;

    padding-top: 23px;

    border-top: 1px solid #1c3044;

    color: #64788d;

    font-size: 10px;

    text-align: center;
}

.footer-brand {
    margin-bottom: 5px;

    color: #aebfd1;

    font-weight: 900;
}


/* ============================================================
   MOBILE
============================================================ */

@media (max-width: 600px) {

    .language-list {
        grid-template-columns: 1fr;
    }

}

@media (max-width: 500px) {

    .page {
        width: calc(100% - 20px);
    }

    .header {
        margin-bottom: 35px;
    }

    .language-card {
        padding: 16px;
    }

    .current-status {
        display: none;
    }

}

</style>

</head>

<body>

<div class="page">


<!-- ============================================================
     HEADER
============================================================ -->

<header class="header">

    <button
        class="back-button"
        type="button"
        onclick="goBack()"
        aria-label="Go back">

        ←

    </button>

    <div class="logo">
        🛡️ Trust<span>AI</span>
    </div>

    <div class="header-spacer"></div>

</header>


<!-- ============================================================
     HERO
============================================================ -->

<section class="hero">

    <div class="hero-badge">
        🌍 TRUSTAI LANGUAGE
    </div>

    <h1 id="pageTitle">
        Language
    </h1>

    <p id="pageDescription">
        Choose the language you want TrustAI to use.
    </p>

</section>


<!-- ============================================================
     LANGUAGE CARD
============================================================ -->

<section class="language-card">


    <!-- CURRENT LANGUAGE -->

    <div class="current-language">

        <div class="current-left">

            <div
                id="currentFlag"
                class="current-flag">

                🇺🇸

            </div>

            <div>

                <div
                    id="currentLabel"
                    class="current-label">

                    Current language

                </div>

                <div
                    id="currentName"
                    class="current-name">

                    English

                </div>

            </div>

        </div>


        <div
            id="currentStatus"
            class="current-status">

            SELECTED

        </div>

    </div>


    <!-- SEARCH -->

    <div class="search-box">

        <input
            id="languageSearch"
            class="search-input"
            type="search"
            autocomplete="off"
            placeholder="Search languages..."
            aria-label="Search languages"
        >

    </div>


    <!-- LANGUAGE LIST -->

    <div
        id="languageList"
        class="language-list">

    </div>


    <div
        id="noResults"
        class="no-results">

        No languages found.

    </div>


    <!-- NOTICE -->

    <div
        id="languageNotice"
        class="notice">

        🌍 Your language selection is saved on this
        device and used across supported TrustAI pages.

    </div>

</section>


<!-- ============================================================
     FOOTER
============================================================ -->

<footer>

    <div class="footer-brand">
        🛡️ TrustAI
    </div>

    Online scam awareness and protection.

    <br><br>

    © 2026 TrustAI

</footer>


</div>


<!-- ============================================================
     EXISTING TRUSTAI LANGUAGE SYSTEM
     
     IMPORTANT:
     Keep your existing 7-language language.js file.
============================================================ -->

<script src="./language.js"></script>


<script>

/* ============================================================
   TRUSTAI LANGUAGE PAGE
   Works with the existing language.js
============================================================ */

"use strict";


/* ============================================================
   THE ONLY 7 LANGUAGES SHOWN ON THIS PAGE
============================================================ */

const TRUSTAI_SEVEN_LANGUAGES = [

    {
        code: "en",
        name: "English",
        nativeName: "English",
        flag: "🇺🇸"
    },

    {
        code: "fr",
        name: "French",
        nativeName: "Français",
        flag: "🇫🇷"
    },

    {
        code: "es",
        name: "Spanish",
        nativeName: "Español",
        flag: "🇪🇸"
    },

    {
        code: "de",
        name: "German",
        nativeName: "Deutsch",
        flag: "🇩🇪"
    },

    {
        code: "sv",
        name: "Swedish",
        nativeName: "Svenska",
        flag: "🇸🇪"
    },

    {
        code: "fi",
        name: "Finnish",
        nativeName: "Suomi",
        flag: "🇫🇮"
    },

    {
        code: "pt",
        name: "Portuguese",
        nativeName: "Português",
        flag: "🇵🇹"
    }

];


/* ============================================================
   DOM
============================================================ */

const languageList =
    document.getElementById("languageList");

const languageSearch =
    document.getElementById("languageSearch");

const noResults =
    document.getElementById("noResults");

const currentFlag =
    document.getElementById("currentFlag");

const currentName =
    document.getElementById("currentName");

const pageTitle =
    document.getElementById("pageTitle");

const pageDescription =
    document.getElementById("pageDescription");

const currentLabel =
    document.getElementById("currentLabel");

const languageNotice =
    document.getElementById("languageNotice");


/* ============================================================
   STORAGE KEY
============================================================ */

const LANGUAGE_STORAGE_KEY =
    "trustai_language";


/* ============================================================
   GET CURRENT LANGUAGE
============================================================ */

function getCurrentLanguage() {

    let saved = "en";

    try {

        saved =
            localStorage.getItem(
                LANGUAGE_STORAGE_KEY
            ) || "en";

    } catch (error) {

        console.warn(
            "TrustAI: Unable to read language.",
            error
        );

    }


    const valid =
        TRUSTAI_SEVEN_LANGUAGES.some(
            function (language) {

                return language.code === saved;

            }
        );


    return valid ? saved : "en";

}


/* ============================================================
   TRANSLATION HELPER
============================================================ */

function translate(key, fallback) {

    try {

        if (
            window.TrustAILanguage &&
            typeof window.TrustAILanguage.t === "function"
        ) {

            const value =
                window.TrustAILanguage.t(key);

            if (value) {

                return value;

            }

        }

    } catch (error) {

        console.warn(
            "TrustAI language translation error:",
            error
        );

    }


    return fallback;

}


/* ============================================================
   RENDER LANGUAGE LIST
============================================================ */

function renderLanguages(filter = "") {

    const current =
        getCurrentLanguage();


    const query =
        filter
            .trim()
            .toLowerCase();


    languageList.innerHTML = "";


    let visibleCount = 0;


    TRUSTAI_SEVEN_LANGUAGES.forEach(
        function(language) {

            const searchable =
                (
                    language.name +
                    " " +
                    language.nativeName +
                    " " +
                    language.code
                ).toLowerCase();


            if (
                query &&
                !searchable.includes(query)
            ) {

                return;

            }


            visibleCount++;


            const button =
                document.createElement("button");


            button.type = "button";

            button.className =
                "language-option";


            if (
                language.code === current
            ) {

                button.classList.add(
                    "selected"
                );

            }


            button.dataset.language =
                language.code;


            button.innerHTML = `

                <div class="language-flag">
                    ${language.flag}
                </div>

                <div class="language-text">

                    <div class="language-name">
                        ${escapeHTML(language.name)}
                    </div>

                    <div class="language-native">
                        ${escapeHTML(language.nativeName)}
                    </div>

                </div>

                <div class="language-check">
                    ✓
                </div>

            `;


            button.addEventListener(
                "click",
                function() {

                    selectLanguage(
                        language.code
                    );

                }
            );


            languageList.appendChild(
                button
            );

        }
    );


    noResults.style.display =
        visibleCount === 0
            ? "block"
            : "none";

}


/* ============================================================
   SELECT LANGUAGE
============================================================ */

function selectLanguage(code) {

    const language =
        TRUSTAI_SEVEN_LANGUAGES.find(
            function(item) {

                return item.code === code;

            }
        );


    if (!language) {

        return;

    }


    /*
       Use the existing language.js API
       when available.
    */

    try {

        if (
            window.TrustAILanguage &&
            typeof window.TrustAILanguage.setLanguage === "function"
        ) {

            window.TrustAILanguage.setLanguage(
                code
            );

        } else {

            localStorage.setItem(
                LANGUAGE_STORAGE_KEY,
                code
            );

        }

    } catch (error) {

        console.warn(
            "TrustAI: Unable to change language.",
            error
        );


        try {

            localStorage.setItem(
                LANGUAGE_STORAGE_KEY,
                code
            );

        } catch (storageError) {}

    }


    /*
       Keep the page synchronized.
    */

    updateCurrentLanguage();

    renderLanguages(
        languageSearch.value
    );


    /*
       Notify other TrustAI pages/components.
    */

    window.dispatchEvent(
        new CustomEvent(
            "trustai-language-changed",
            {
                detail: {
                    language: code
                }
            }
        )
    );

}


/* ============================================================
   UPDATE CURRENT LANGUAGE
============================================================ */

function updateCurrentLanguage() {

    const current =
        getCurrentLanguage();


    const language =
        TRUSTAI_SEVEN_LANGUAGES.find(
            function(item) {

                return item.code === current;

            }
        ) ||
        TRUSTAI_SEVEN_LANGUAGES[0];


    currentFlag.textContent =
        language.flag;


    currentName.textContent =
        language.nativeName;


    /*
       Translate page text when
       the existing language system
       exposes its translation API.
    */

    pageTitle.textContent =
        translate(
            "languageTitle",
            "Language"
        );


    pageDescription.textContent =
        translate(
            "languageDescription",
            "Choose the language you want TrustAI to use."
        );


    currentLabel.textContent =
        translate(
            "currentLanguage",
            "Current language"
        );


    languageSearch.placeholder =
        translate(
            "searchLanguages",
            "Search languages..."
        );


    languageNotice.textContent =
        translate(
            "languageNotice",
            "🌍 Your language selection is saved on this device and used across supported TrustAI pages."
        );

}


/* ============================================================
   ESCAPE HTML
============================================================ */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

/* ============================================================
   SEARCH
============================================================ */

languageSearch.addEventListener(
    "input",
    function() {

        renderLanguages(
            languageSearch.value
        );

    }
);


/* ============================================================
   BACK
============================================================ */

function goBack() {

    if (document.referrer) {

        window.history.back();

    } else {

        window.location.href =
            "./index.html";

    }

}


/* ============================================================
   LANGUAGE CHANGE EVENT
============================================================ */

window.addEventListener(
    "trustai-language-changed",
    function() {

        updateCurrentLanguage();

        renderLanguages(
            languageSearch.value
        );

    }
);


/* ============================================================
   START
============================================================ */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        updateCurrentLanguage();

        renderLanguages();

    }
);

</script>

</body>
</html>
