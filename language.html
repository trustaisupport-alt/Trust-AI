<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>TrustAI — Language</title>

<meta name="description"
content="Choose the language you want TrustAI to use.">

<!-- =====================================================
     TRUSTAI LANGUAGE SYSTEM
===================================================== -->

<script src="./language.js"></script>


<style>

/* =====================================================
   GLOBAL
===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html {
    scroll-behavior: smooth;
}

body {

    margin: 0;

    min-height: 100vh;

    background:
        radial-gradient(
            circle at 10% 0%,
            rgba(59,130,246,.14),
            transparent 35%
        ),
        radial-gradient(
            circle at 90% 20%,
            rgba(124,92,255,.10),
            transparent 35%
        ),
        #050b14;

    color: #f8fafc;

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

}


/* =====================================================
   PAGE
===================================================== */

.page {

    width: min(
        760px,
        calc(100% - 24px)
    );

    margin: auto;

    padding:
        20px
        0
        50px;

}


/* =====================================================
   HEADER
===================================================== */

.header {

    display: flex;

    align-items: center;

    gap: 14px;

    margin-bottom: 35px;

}

.back-button {

    width: 45px;
    height: 45px;

    border:
        1px solid
        #263b52;

    border-radius: 12px;

    background:
        #0b1726;

    color: white;

    font-size: 22px;

    cursor: pointer;

    transition: .2s;

}

.back-button:hover {

    border-color:
        #3b82f6;

    transform:
        translateY(-1px);

}

.logo {

    font-size: 23px;

    font-weight: 900;

}

.logo span {

    color:
        #60a5fa;

}


/* =====================================================
   HERO
===================================================== */

.hero {

    text-align: center;

    margin-bottom: 28px;

}

.hero-icon {

    width: 64px;
    height: 64px;

    margin:
        0 auto
        15px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 18px;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #7c3aed
        );

    font-size: 29px;

}

.hero h1 {

    margin:
        0 0 8px;

    font-size:
        clamp(
            29px,
            7vw,
            42px
        );

}

.hero p {

    max-width: 580px;

    margin: auto;

    color:
        #91a7bf;

    font-size: 14px;

    line-height: 1.6;

}


/* =====================================================
   LANGUAGE CARD
===================================================== */

.language-card {

    padding: 24px;

    border:
        1px solid
        #263b52;

    border-radius: 20px;

    background:
        linear-gradient(
            145deg,
            #0d2034,
            #091522
        );

    box-shadow:
        0
        15px
        40px
        rgba(0,0,0,.25);

}


/* =====================================================
   CURRENT LANGUAGE
===================================================== */

.current-box {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;

    padding: 16px;

    margin-bottom: 22px;

    border:
        1px solid
        #31506c;

    border-radius: 14px;

    background:
        rgba(
            59,
            130,
            246,
            .07
        );

}

.current-left {

    display: flex;

    align-items: center;

    gap: 12px;

}

.current-flag {

    width: 43px;
    height: 43px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 12px;

    background:
        #13283f;

    font-size: 24px;

}

.current-label {

    color:
        #8197ad;

    font-size: 10px;

    font-weight: 800;

    text-transform: uppercase;

    letter-spacing: .5px;

}

.current-name {

    margin-top: 3px;

    font-size: 16px;

    font-weight: 900;

}

.current-code {

    color:
        #60a5fa;

    font-size: 11px;

    font-weight: 800;

}


/* =====================================================
   SEARCH
===================================================== */

.search-box {

    margin-bottom: 17px;

}

.search-input {

    width: 100%;

    height: 48px;

    padding:
        0
        15px;

    border:
        1px solid
        #31506c;

    border-radius: 11px;

    background:
        #07111d;

    color: white;

    outline: none;

    font-size: 14px;

}

.search-input::placeholder {

    color:
        #64788d;

}

.search-input:focus {

    border-color:
        #3b82f6;

    box-shadow:
        0
        0
        0
        3px
        rgba(
            59,
            130,
            246,
            .12
        );

}


/* =====================================================
   LANGUAGE LIST
===================================================== */

.language-list {

    display: grid;

    gap: 10px;

}


/* =====================================================
   LANGUAGE OPTION
===================================================== */

.language-option {

    width: 100%;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 12px;

    padding: 14px;

    border:
        1px solid
        #263b52;

    border-radius: 13px;

    background:
        #091522;

    color: white;

    text-align: left;

    cursor: pointer;

    transition: .2s;

}

.language-option:hover {

    border-color:
        #3b82f6;

    transform:
        translateY(-1px);

}

.language-option.selected {

    border-color:
        #3b82f6;

    background:
        rgba(
            59,
            130,
            246,
            .09
        );

    box-shadow:
        0
        0
        0
        1px
        rgba(
            59,
            130,
            246,
            .12
        );

}

.language-main {

    display: flex;

    align-items: center;

    gap: 13px;

}

.language-flag {

    width: 43px;
    height: 43px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 11px;

    background:
        #13283f;

    font-size: 23px;

}

.language-name {

    font-size: 15px;

    font-weight: 900;

}

.language-native {

    margin-top: 2px;

    color:
        #8197ad;

    font-size: 11px;

}

.language-check {

    width: 25px;
    height: 25px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    border:
        1px solid
        #38536e;

    color:
        transparent;

    font-size: 13px;

    font-weight: 900;

}

.language-option.selected
.language-check {

    background:
        #3b82f6;

    border-color:
        #3b82f6;

    color: white;

}


/* =====================================================
   EMPTY
===================================================== */

.empty {

    display: none;

    padding: 25px;

    color:
        #8197ad;

    text-align: center;

    font-size: 13px;

}

.empty.show {

    display: block;

}


/* =====================================================
   NOTICE
===================================================== */

.notice {

    margin-top: 18px;

    padding: 16px;

    border:
        1px solid
        #263b52;

    border-radius: 14px;

    background:
        rgba(
            255,
            255,
            255,
            .025
        );

    color:
        #8197ad;

    text-align: center;

    font-size: 11px;

    line-height: 1.6;

}


/* =====================================================
   FOOTER
===================================================== */

footer {

    margin-top: 35px;

    padding-top: 22px;

    border-top:
        1px solid
        #1c3044;

    color:
        #64788d;

    text-align: center;

    font-size: 11px;

}

.footer-brand {

    margin-bottom: 5px;

    color:
        #aebfd1;

    font-weight: 900;

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    .page {

        width:
            calc(100% - 20px);

    }

    .language-card {

        padding: 18px;

    }

    .current-box {

        align-items:
            flex-start;

    }

}

</style>

</head>


<body>


<div class="page">


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <button
        class="back-button"
        type="button"
        onclick="goBack()"
        aria-label="Go back">

        ←

    </button>


    <div class="logo">

        🛡️ Trust<span>AI</span>

    </div>

</header>


<!-- =====================================================
     HERO
===================================================== -->

<section class="hero">

    <div class="hero-icon">

        🌍

    </div>


    <h1 data-i18n="languageTitle">

        Language

    </h1>


    <p data-i18n="languageDescription">

        Choose the language you want TrustAI to use.

    </p>

</section>


<!-- =====================================================
     LANGUAGE CARD
===================================================== -->

<main class="language-card">


<!-- =====================================================
     CURRENT LANGUAGE
===================================================== -->

<section class="current-box">


    <div class="current-left">


        <div
            id="currentFlag"
            class="current-flag">

            🇬🇧

        </div>


        <div>

            <div
                class="current-label"
                data-i18n="currentLanguage">

                Current language

            </div>


            <div
                id="currentName"
                class="current-name">

                English

            </div>

        </div>


    </div>


    <div
        id="currentCode"
        class="current-code">

        EN

    </div>


</section>


<!-- =====================================================
     SEARCH
===================================================== -->

<div class="search-box">

    <input
        id="languageSearch"
        class="search-input"
        type="search"
        data-i18n-placeholder="searchLanguages"
        placeholder="Search languages..."
        autocomplete="off">

</div>


<!-- =====================================================
     LANGUAGE LIST
===================================================== -->

<div
    id="languageList"
    class="language-list">
</div>


<div
    id="emptyState"
    class="empty">

    No language found.

</div>


</main>


<!-- =====================================================
     NOTICE
===================================================== -->

<section class="notice">

    <strong
        data-i18n="languageNoticeTitle">

        🌍 TrustAI languages

    </strong>

    <br>

    <span
        data-i18n="languageNotice">

        Your language selection is saved on this device
        and used across supported TrustAI pages.

    </span>

</section>


<!-- =====================================================
     FOOTER
===================================================== -->

<footer>

    <div class="footer-brand">

        🛡️ TrustAI

    </div>

    Online scam awareness and protection.

    <br><br>

    © 2026 TrustAI

</footer>


</div>


<script>

/* =====================================================
   TRUSTAI LANGUAGE PAGE
===================================================== */

(function () {

"use strict";


/* =====================================================
   WAIT FOR LANGUAGE SYSTEM
===================================================== */

function getLanguageSystem() {

    return window.TrustAILanguage || null;

}


/* =====================================================
   GET LANGUAGES
===================================================== */

function getLanguages() {

    const system =
        getLanguageSystem();


    if (
        !system ||
        !system.languages
    ) {

        return {};

    }


    /*
       Only these 7 languages are displayed.
    */

    const allowed = [

        "en",
        "fr",
        "es",
        "pt",
        "zh",
        "de",
        "ar"

    ];


    const result = {};


    allowed.forEach(
        function (code) {

            if (
                system.languages[code]
            ) {

                result[code] =
                    system.languages[code];

            }

        }
    );


    return result;

}


/* =====================================================
   RENDER CURRENT LANGUAGE
===================================================== */

function renderCurrentLanguage() {

    const system =
        getLanguageSystem();


    if (!system) {

        return;

    }


    const code =
        system.getLanguageCode();


    const language =
        system.languages[code];


    if (!language) {

        return;

    }


    document.getElementById(
        "currentFlag"
    ).textContent =
        language.flag;


    document.getElementById(
        "currentName"
    ).textContent =
        language.nativeName;


    document.getElementById(
        "currentCode"
    ).textContent =
        code.toUpperCase();

}


/* =====================================================
   RENDER LANGUAGES
===================================================== */

function renderLanguages(
    search = ""
) {

    const list =
        document.getElementById(
            "languageList"
        );


    const empty =
        document.getElementById(
            "emptyState"
        );


    const languages =
        getLanguages();


    list.innerHTML = "";


    const query =
        search
            .trim()
            .toLowerCase();


    let visibleCount = 0;


    Object.keys(languages)
        .forEach(
            function (code) {

                const language =
                    languages[code];


                const searchableText =

                    (
                        language.name +
                        " " +
                        language.nativeName +
                        " " +
                        code
                    )
                    .toLowerCase();


                if (
                    query &&
                    !searchableText.includes(
                        query
                    )
                ) {

                    return;

                }


                visibleCount++;


                const button =
                    document.createElement(
                        "button"
                    );


                button.type =
                    "button";


                button.className =
                    "language-option";


                button.dataset.code =
                    code;


                button.innerHTML = `

                    <div class="language-main">

                        <div class="language-flag">

                            ${language.flag}

                        </div>

                        <div>

                            <div class="language-name">

                                ${language.name}

                            </div>

                            <div class="language-native">

                                ${language.nativeName}

                            </div>

                        </div>

                    </div>

                    <div class="language-check">

                        ✓

                    </div>

                `;


                button.addEventListener(
                    "click",
                    function () {

                        selectLanguage(
                            code
                        );

                    }
                );


                list.appendChild(
                    button
                );

            }
        );


    empty.classList.toggle(
        "show",
        visibleCount === 0
    );


    updateSelectedState();

}


/* =====================================================
   UPDATE SELECTED STATE
===================================================== */

function updateSelectedState() {

    const system =
        getLanguageSystem();


    if (!system) {

        return;

    }


    const current =
        system.getLanguageCode();


    document
        .querySelectorAll(
            ".language-option"
        )
        .forEach(
            function (button) {

                button.classList.toggle(
                    "selected",
                    button.dataset.code === current
                );

            }
        );


    renderCurrentLanguage();

}


/* =====================================================
   SELECT LANGUAGE
===================================================== */

function selectLanguage(
    code
) {

    const system =
        getLanguageSystem();


    if (!system) {

        alert(
            "TrustAI language system is not available."
        );

        return;

    }


    const success =
        system.setLanguage(code);


    if (!success) {

        return;

    }


    /*
       Re-render the page so the
       selected language updates immediately.
    */

    renderLanguages(
        document.getElementById(
            "languageSearch"
        ).value
    );


    /*
       Update the page title.
    */

    document.title =
        "TrustAI — " +
        system.languages[code].nativeName;

}


/* =====================================================
   SEARCH
===================================================== */

document
    .getElementById(
        "languageSearch"
    )
    .addEventListener(
        "input",
        function () {

            renderLanguages(
                this.value
            );

        }
    );


/* =====================================================
   LANGUAGE CHANGE EVENT
===================================================== */

window.addEventListener(
    "trustai-language-changed",
    function () {

        /*
           The language.js system has already
           applied data-i18n translations.

           Refresh the language list.
        */

        renderLanguages(
            document.getElementById(
                "languageSearch"
            ).value
        );

    }
);


/* =====================================================
   BACK BUTTON
===================================================== */

window.goBack =
function () {

    if (
        document.referrer
    ) {

        window.history.back();

    } else {

        window.location.href =
            "./settings.html";

    }

};


/* =====================================================
   INITIALIZE
===================================================== */

function initialize() {

    renderLanguages();

    renderCurrentLanguage();

}


/*
   language.js loads before this script.
*/

if (
    document.readyState ===
    "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        initialize
    );

} else {

    initialize();

}


})();

</script>


</body>

</html>
