<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TrustAI - Feedback</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #050811;
    color: #f8fafc;
}

.page {
    max-width: 700px;
    margin: auto;
    padding: 35px 18px 50px;
}

/* HEADER */

.header {
    text-align: center;
    margin-bottom: 25px;
}

.logo {
    font-size: 42px;
    margin-bottom: 8px;
}

.header h1 {
    margin: 0;
    font-size: 30px;
}

.header p {
    color: #94a3b8;
    line-height: 1.6;
    margin-top: 10px;
}

/* CARD */

.card {
    background: #111a2e;
    border: 1px solid #1e2e4a;
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.35);
}

.card h2 {
    margin-top: 0;
    font-size: 21px;
}

.card-description {
    color: #94a3b8;
    line-height: 1.6;
}

/* FORM */

label {
    display: block;
    margin-top: 20px;
    margin-bottom: 8px;
    color: #e2e8f0;
    font-size: 14px;
    font-weight: bold;
}

input,
select,
textarea {
    width: 100%;
    padding: 14px 15px;
    border: 1px solid #263957;
    border-radius: 11px;
    background: #050811;
    color: #f8fafc;
    font-size: 15px;
    font-family: inherit;
    outline: none;
}

input::placeholder,
textarea::placeholder {
    color: #64748b;
}

input:focus,
select:focus,
textarea:focus {
    border-color: #38bdf8;
    box-shadow: 0 0 15px rgba(56,189,248,0.15);
}

textarea {
    min-height: 150px;
    resize: vertical;
}

/* BUTTON */

button {
    width: 100%;
    margin-top: 22px;
    padding: 15px;
    border: none;
    border-radius: 11px;
    background: #0284c7;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background: #0369a1;
    box-shadow: 0 0 20px rgba(2,132,199,0.35);
}

/* RESULT */

#result {
    margin-top: 18px;
    padding: 15px;
    border-radius: 11px;
    display: none;
    line-height: 1.5;
}

.success {
    display: block !important;
    background: rgba(16,185,129,0.12);
    border: 1px solid #10b981;
    color: #6ee7b7;
}

.warning {
    display: block !important;
    background: rgba(245,158,11,0.12);
    border: 1px solid #f59e0b;
    color: #fde68a;
}

/* HOME */

.home-link {
    display: block;
    width: 100%;
    margin-top: 22px;
    padding: 14px;
    border: 1px solid #1e2e4a;
    border-radius: 11px;
    background: #111a2e;
    color: #38bdf8;
    text-align: center;
    text-decoration: none;
    font-weight: bold;
    transition: 0.2s;
}

.home-link:hover {
    background: #16223b;
    border-color: #38bdf8;
}

/* FOOTER */

.footer {
    text-align: center;
    margin-top: 30px;
    color: #64748b;
    font-size: 12px;
}

/* MOBILE */

@media (max-width: 600px) {

    .page {
        padding: 25px 14px 40px;
    }

    .card {
        padding: 20px;
    }

    .header h1 {
        font-size: 26px;
    }

}

</style>

</head>


<body>

<div class="page">


    <!-- HEADER -->

    <div class="header">

        <div class="logo">🛡️</div>

        <h1>TrustAI</h1>

        <p>
            Help us make online safety better.
            Your feedback helps improve TrustAI.
        </p>

    </div>


    <!-- FEEDBACK CARD -->

    <div class="card">

        <h2>💬 Share Your Feedback</h2>

        <p class="card-description">
            Tell us what you like, what we can improve,
            or what features you would like to see next.
        </p>


        <form onsubmit="sendFeedback(event)">


            <label for="name">
                Name <span style="color:#64748b;">(optional)</span>
            </label>

            <input
                type="text"
                id="name"
                placeholder="Your name"
            >


            <label for="rating">
                How would you rate TrustAI?
            </label>

            <select id="rating">

                <option value="">
                    Select a rating
                </option>

                <option value="1">
                    ⭐ 1 - Very poor
                </option>

                <option value="2">
                    ⭐⭐ 2 - Poor
                </option>

                <option value="3">
                    ⭐⭐⭐ 3 - Good
                </option>

                <option value="4">
                    ⭐⭐⭐⭐ 4 - Very good
                </option>

                <option value="5">
                    ⭐⭐⭐⭐⭐ 5 - Excellent
                </option>

            </select>


            <label for="feedback">
                Your feedback
            </label>

            <textarea
                id="feedback"
                placeholder="What should we improve?"
                required
            ></textarea>


            <button type="submit">
                🚀 Send Feedback
            </button>


        </form>


        <div id="result"></div>

    </div>


    <!-- HOME AT BOTTOM -->

    <a
        href="home.html"
        class="home-link"
    >
        🏠 Home
    </a>


    <div class="footer">
        🛡️ TrustAI • Online Scam Protection
    </div>


</div>


<script>

function sendFeedback(event) {

    event.preventDefault();


    const name =
        document.getElementById("name").value.trim();

    const rating =
        document.getElementById("rating").value;

    const feedback =
        document.getElementById("feedback").value.trim();

    const result =
        document.getElementById("result");


    /* VALIDATION */

    if (rating === "") {

        result.className = "warning";

        result.textContent =
            "⚠️ Please select a rating before sending your feedback.";

        return;
    }


    if (feedback === "") {

        result.className = "warning";

        result.textContent =
            "⚠️ Please write your feedback before sending.";

        return;
    }


    /* SAVE FEEDBACK */

    const feedbackData = {

        name: name || "Anonymous",

        rating: rating,

        feedback: feedback,

        date: new Date().toLocaleString()

    };


    const savedFeedback =
        JSON.parse(
            localStorage.getItem("trustAIFeedback")
        ) || [];


    savedFeedback.push(feedbackData);


    localStorage.setItem(
        "trustAIFeedback",
        JSON.stringify(savedFeedback)
    );


    /* SUCCESS */

    result.className = "success";

    result.textContent =
        "✅ Thank you for your feedback!\n\n" +
        "Your feedback has been saved successfully.";


    /* CLEAR FORM */

    document.getElementById("name").value = "";

    document.getElementById("rating").value = "";

    document.getElementById("feedback").value = "";

}

</script>

</body>

</html>
