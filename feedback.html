<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>TrustAI - Feedback</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        .page {
            max-width: 700px;
            margin: auto;
            padding: 25px 18px 40px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
        }

        .back {
            text-decoration: none;
            color: #1459c7;
            font-weight: bold;
        }

        .card {
            background: white;
            border: 1px solid #e0e6ef;
            border-radius: 20px;
            padding: 25px;
        }

        h1 {
            margin-top: 0;
        }

        p {
            color: #657184;
            line-height: 1.6;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccd4df;
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
        }

        textarea {
            min-height: 140px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #1459c7;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #result {
            margin-top: 18px;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }

        .success {
            display: block !important;
            background: #e9f8ef;
            color: #16803c;
        }

    </style>

</head>

<body>

<div class="page">

    <div class="header">

        <a class="back" href="home.html">
            ← Back
        </a>

    </div>


    <div class="card">

        <h1>💬 TrustAI Feedback</h1>

        <p>
            Help us improve TrustAI. Tell us what you
            like, what could be better, or what feature
            you would like to see next.
        </p>


        <form onsubmit="sendFeedback(event)">

            <label for="name">
                Name (optional)
            </label>

            <input
                type="text"
                id="name"
                placeholder="Your name"
            >


            <label for="rating">
                How would you rate TrustAI?
            </label>

            <select id="rating">

                <option value="">
                    Select a rating
                </option>

                <option>⭐ 1 - Very poor</option>
                <option>⭐⭐ 2 - Poor</option>
                <option>⭐⭐⭐ 3 - Good</option>
                <option>⭐⭐⭐⭐ 4 - Very good</option>
                <option>⭐⭐⭐⭐⭐ 5 - Excellent</option>

            </select>


            <label for="feedback">
                Your feedback
            </label>

            <textarea
                id="feedback"
                placeholder="What should we improve?"
                required
            ></textarea>


            <button type="submit">
                Send Feedback
            </button>

        </form>


        <div id="result"></div>

    </div>

</div>


<script>

function sendFeedback(event) {

    event.preventDefault();

    let name =
        document.getElementById("name").value.trim();

    let rating =
        document.getElementById("rating").value;

    let feedback =
        document.getElementById("feedback").value.trim();

    let result =
        document.getElementById("result");


    if (rating === "") {

        result.textContent =
            "⚠️ Please select a rating.";

        result.className = "success";

        return;
    }


    console.log({
        name: name,
        rating: rating,
        feedback: feedback
    });


    result.textContent =
        "✅ Thank you for your feedback!";

    result.className = "success";


    document.getElementById("feedback").value = "";

}

</script>

</body>

  </html>
