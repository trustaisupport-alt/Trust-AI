<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Change Password — TrustAI</title>

<!-- SUPABASE JS SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #050b14;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
}

.page {
    width: 100%;
    max-width: 600px;
    margin: auto;
    padding: 30px 18px 50px;
}

.header {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 30px;
}

.back-button {
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 11px;
    background: #1687ff;
    color: white;
    font-size: 22px;
    cursor: pointer;
}

.back-button:hover {
    background: #0877eb;
}

.logo {
    font-size: 24px;
    font-weight: 800;
}

.logo span {
    color: #1687ff;
}

.title {
    margin-bottom: 25px;
}

.title h1 {
    margin: 0 0 8px;
    font-size: 28px;
}

.title p {
    margin: 0;
    color: #8998aa;
    font-size: 14px;
    line-height: 1.5;
}

.card {
    background: #0b1420;
    border: 1px solid #1b2b3d;
    border-radius: 16px;
    padding: 25px 20px;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    color: #8998aa;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.input-box {
    position: relative;
    width: 100%;
}

.input-box input {
    width: 100%;
    background: #101c2b;
    border: 1px solid #26384d;
    border-radius: 11px;
    padding: 14px 16px;
    color: white;
    font-size: 15px;
    outline: none;
    transition: 0.2s;
}

.input-box input:focus {
    border-color: #1687ff;
    background: #050b14;
}

.submit-btn {
    width: 100%;
    background: #1687ff;
    color: white;
    border: none;
    border-radius: 11px;
    padding: 15px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
    margin-top: 10px;
}

.submit-btn:hover {
    background: #0877eb;
}

.footer {
    text-align: center;
    color: #657386;
    font-size: 12px;
    margin-top: 35px;
    padding-top: 20px;
    border-top: 1px solid #182536;
}

@media (max-width: 600px) {
    .page {
        padding: 20px 14px 40px;
    }
}

</style>

</head>

<body>

<div class="page">

    <header class="header">
        <button class="back-button" onclick="history.back()" aria-label="Go back">←</button>
        <div class="logo">🛡️ Trust<span>AI</span></div>
    </header>

    <div class="title">
        <h1>Change Password</h1>
        <p>Enter your current password and choose a secure new password for your account.</p>
    </div>

    <div class="card">
        <form id="changePasswordForm" onsubmit="handlePasswordChange(event)">
            
            <div class="form-group">
                <label for="currentPassword">Current Password</label>
                <div class="input-box">
                    <input type="password" id="currentPassword" required placeholder="Enter current password">
                </div>
            </div>

            <div class="form-group">
                <label for="newPassword">New Password</label>
                <div class="input-box">
                    <input type="password" id="newPassword" required placeholder="Enter new password (min. 6 characters)">
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm New Password</label>
                <div class="input-box">
                    <input type="password" id="confirmPassword" required placeholder="Re-enter new password">
                </div>
            </div>

            <button type="submit" class="submit-btn">Save Changes</button>

        </form>
    </div>

    <footer class="footer">
        <strong>🛡️ TrustAI</strong><br><br>
        Online scam awareness and protection.<br><br>
        © 2026 TrustAI
    </footer>

</div>

<script>

function handlePasswordChange(event) {
    event.preventDefault();

    const currentPassword = document.getElementById("currentPassword").value;
    const newPassword = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (newPassword.length < 6) {
        alert("New password must be at least 6 characters long.");
        return;
    }

    if (newPassword !== confirmPassword) {
        alert("New passwords do not match. Please check and try again.");
        return;
    }

    if (currentPassword === newPassword) {
        alert("New password cannot be the same as your current password.");
        return;
    }

    alert("Password successfully updated!");
    
    document.getElementById("changePasswordForm").reset();
    window.location.href = "./security.html";
}

</script>

</body>

</html>
