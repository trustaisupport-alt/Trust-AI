<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile — TrustAI</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #050b14;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
}

.page {
    width: 100%;
    max-width: 900px;
    margin: auto;
    padding: 30px 18px 50px;
}

.header {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 30px;
}

.back-button {
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 11px;
    background: #1687ff;
    color: white;
    font-size: 22px;
    cursor: pointer;
}

.logo {
    font-size: 24px;
    font-weight: 800;
}

.logo span {
    color: #1687ff;
}

.title {
    margin-bottom: 28px;
}

.title h1 {
    margin: 0 0 8px;
    font-size: 30px;
}

.title p {
    margin: 0;
    color: #8998aa;
    font-size: 14px;
    line-height: 1.5;
}

.card {
    background: #0b1420;
    border: 1px solid #1b2b3d;
    border-radius: 15px;
    overflow: hidden;
    margin-bottom: 25px;
}

.profile-header {
    text-align: center;
    padding: 28px 20px;
    border-bottom: 1px solid #1b2b3d;
}

.avatar {
    width: 76px;
    height: 76px;
    margin: 0 auto 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: linear-gradient(
        135deg,
        #1687ff,
        #2563eb
    );
    font-size: 30px;
}

.profile-header h2 {
    margin: 0 0 6px;
    font-size: 20px;
}

.profile-header p {
    margin: 0;
    color: #8998aa;
    font-size: 13px;
}

.form-group {
    padding: 17px;
    border-bottom: 1px solid #1b2b3d;
}

.form-group:last-child {
    border-bottom: none;
}

label {
    display: block;
    margin-bottom: 7px;
    font-size: 13px;
    font-weight: bold;
}

input {
    width: 100%;
    height: 46px;
    padding: 0 13px;
    border: 1px solid #26384d;
    border-radius: 9px;
    background: #101c2b;
    color: #ffffff;
    font-size: 14px;
    outline: none;
}

input:focus {
    border-color: #1687ff;
    box-shadow:
        0 0 0 3px rgba(22, 135, 255, 0.12);
}

input::placeholder {
    color: #657386;
}

input:disabled {
    opacity: 0.7;
    cursor: not-allowed;
}

.button-area {
    padding: 17px;
}

.save-button {
    width: 100%;
    height: 48px;
    border: none;
    border-radius: 9px;
    background: #1687ff;
    color: white;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

.save-button:hover {
    background: #0877eb;
}

.message {
    display: none;
    margin-bottom: 18px;
    padding: 12px 14px;
    border-radius: 9px;
    background: rgba(52, 211, 153, 0.08);
    border: 1px solid rgba(52, 211, 153, 0.2);
    color: #6ee7b7;
    font-size: 13px;
}

.message.show {
    display: block;
}

.footer {
    text-align: center;
    color: #657386;
    font-size: 12px;
    margin-top: 35px;
    padding-top: 20px;
    border-top: 1px solid #182536;
}

@media (max-width: 600px) {

    .page {
        padding: 20px 14px 40px;
    }

    .title h1 {
        font-size: 26px;
    }

}

</style>

</head>

<body>

<div class="page">

<header class="header">

    <button
        class="back-button"
        onclick="history.back()"
        aria-label="Go back">

        ←

    </button>

    <div class="logo">
        🛡️ Trust<span>AI</span>
    </div>

</header>


<section class="title">

    <h1>
        Profile
    </h1>

    <p>
        Manage your TrustAI profile information.
    </p>

</section>


<div
    id="message"
    class="message">
</div>


<div class="card">


    <div class="profile-header">

        <div class="avatar">
            👤
        </div>

        <h2 id="profileName">
            TrustAI User
        </h2>

        <p>
            Your TrustAI account
        </p>

    </div>


    <div class="form-group">

        <label for="name">
            Display name
        </label>

        <input
            type="text"
            id="name"
            placeholder="Enter your name"
            autocomplete="name">

    </div>


    <div class="form-group">

        <label for="email">
            Email address
        </label>

        <input
            type="email"
            id="email"
            placeholder="you@example.com"
            autocomplete="email">

    </div>


    <div class="button-area">

        <button
            class="save-button"
            onclick="saveProfile()">

            Save changes

        </button>

    </div>

</div>


<footer class="footer">

    <strong>
        🛡️ TrustAI
    </strong>

    <br><br>

    Manage your TrustAI account profile.

    <br><br>

    © 2026 TrustAI

</footer>

</div>


<script>

function showMessage(message) {

    const box =
        document.getElementById("message");

    box.textContent = message;

    box.classList.add("show");

}


function saveProfile() {

    const name =
        document
            .getElementById("name")
            .value
            .trim();

    const email =
        document
            .getElementById("email")
            .value
            .trim();


    if (!name) {

        showMessage(
            "Please enter your display name."
        );

        return;

    }


    if (!email) {

        showMessage(
            "Please enter your email address."
        );

        return;

    }


    localStorage.setItem(
        "trustai_profileName",
        name
    );

    localStorage.setItem(
        "trustai_profileEmail",
        email
    );


    document.getElementById(
        "profileName"
    ).textContent = name;


    showMessage(
        "Your profile has been saved on this device."
    );

}


function loadProfile() {

    const name =
        localStorage.getItem(
            "trustai_profileName"
        );

    const email =
        localStorage.getItem(
            "trustai_profileEmail"
        );


    if (name) {

        document.getElementById(
            "name"
        ).value = name;

        document.getElementById(
            "profileName"
        ).textContent = name;

    }


    if (email) {

        document.getElementById(
            "email"
        ).value = email;

    }

}


loadProfile();

</script>

</body>

  </html>
