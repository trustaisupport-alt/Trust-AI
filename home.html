/* =====================================================
   TRUSTAI — PREMIUM CLIENT HOME
   ===================================================== */

:root {
    --blue: #2563eb;
    --cyan: #06b6d4;
    --indigo: #4f46e5;

    --dark: #07111f;
    --dark-2: #0b1728;

    --text: #0f172a;
    --muted: #64748b;

    --white: #ffffff;
    --soft: #f8fafc;

    --border: rgba(148,163,184,.18);

    --shadow:
        0 20px 50px rgba(15,23,42,.08);

    --shadow-hover:
        0 25px 60px rgba(37,99,235,.16);
}


/* =====================================================
   RESET
   ===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at 0% 0%,
            rgba(37,99,235,.08),
            transparent 32%
        ),
        radial-gradient(
            circle at 100% 20%,
            rgba(6,182,212,.07),
            transparent 32%
        ),
        #f8fafc;

    color: var(--text);

    line-height: 1.6;

    min-height: 100vh;
}

a {
    text-decoration: none;
}


/* =====================================================
   PAGE
   ===================================================== */

.page {
    width: min(1120px, calc(100% - 28px));
    margin: auto;
    padding-bottom: 40px;
}


/* =====================================================
   HEADER
   ===================================================== */

.header {
    height: 78px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    position: relative;
    z-index: 50;
}


/* MENU BUTTON */

.menu-button {
    width: 46px;
    height: 46px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    gap: 5px;

    border: 1px solid var(--border);
    border-radius: 14px;

    background: rgba(255,255,255,.82);

    cursor: pointer;

    box-shadow:
        0 8px 25px rgba(15,23,42,.06);

    transition: .25s ease;
}

.menu-button:hover {
    transform: translateY(-2px);

    border-color:
        rgba(37,99,235,.35);

    box-shadow:
        0 12px 30px rgba(37,99,235,.12);
}

.menu-button span {
    width: 19px;
    height: 2px;

    border-radius: 5px;

    background: #334155;

    transition: .25s ease;
}


/* MENU ACTIVE */

.menu-button.active span:nth-child(1) {
    transform:
        translateY(7px)
        rotate(45deg);
}

.menu-button.active span:nth-child(2) {
    opacity: 0;
}

.menu-button.active span:nth-child(3) {
    transform:
        translateY(-7px)
        rotate(-45deg);
}


/* BRAND */

.brand {
    display: flex;
    align-items: center;
    gap: 11px;
}

.brand-shield {
    width: 43px;
    height: 43px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 13px;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #06b6d4
        );

    color: white;

    font-size: 21px;

    box-shadow:
        0 10px 25px rgba(37,99,235,.28);
}

.brand-name {
    font-size: 23px;
    font-weight: 900;

    letter-spacing: -.8px;

    background:
        linear-gradient(
            135deg,
            #0f172a,
            #2563eb
        );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;
}


/* =====================================================
   SIDE MENU
   ===================================================== */

.side-menu {
    position: fixed;

    top: 0;
    left: 0;

    width: 290px;
    height: 100vh;

    padding: 95px 22px 30px;

    background:
        linear-gradient(
            160deg,
            #07111f,
            #0b1728
        );

    box-shadow:
        15px 0 50px rgba(0,0,0,.22);

    z-index: 100;

    transform:
        translateX(-105%);

    transition:
        transform .35s
        cubic-bezier(.22,1,.36,1);
}

.side-menu.open {
    transform: translateX(0);
}

.side-menu h3 {
    color: white;

    font-size: 11px;

    letter-spacing: 1.5px;

    text-transform: uppercase;

    margin-bottom: 14px;
}

.menu-link {
    display: flex;
    align-items: center;
    gap: 12px;

    padding: 13px 14px;

    margin-bottom: 6px;

    border-radius: 12px;

    color: #cbd5e1;

    font-size: 14px;
    font-weight: 700;

    transition: .2s ease;
}

.menu-link:hover {
    background:
        rgba(56,189,248,.09);

    color: #fff;

    transform: translateX(4px);
}

.menu-link span {
    font-size: 18px;
}
