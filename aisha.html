<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Aisha — Trust AI</title>

<style>

/* =====================================================
   TRUST AI — AISHA
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        linear-gradient(
            180deg,
            #07111f,
            #0b1728
        );

    color: #ffffff;

    min-height: 100vh;

}


/* =====================================================
   HEADER
===================================================== */

.header {

    height: 70px;

    display: flex;

    align-items: center;

    gap: 12px;

    padding: 0 18px;

    background: #0d1b2d;

    border-bottom:
        1px solid
        rgba(255,255,255,0.08);

    position: sticky;

    top: 0;

    z-index: 10;

}


.back-button {

    width: 42px;

    height: 42px;

    border: none;

    border-radius: 12px;

    background: #17283d;

    color: white;

    font-size: 22px;

    cursor: pointer;

}


.aisha-avatar {

    width: 44px;

    height: 44px;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        linear-gradient(
            135deg,
            #6c63ff,
            #00c6ff
        );

    font-size: 22px;

    font-weight: bold;

}


.header-info {

    flex: 1;

}


.header-info h1 {

    font-size: 18px;

    margin-bottom: 3px;

}


.header-info p {

    font-size: 12px;

    color: #8fa4bd;

}


/* =====================================================
   CHAT AREA
===================================================== */

.chat-container {

    max-width: 850px;

    margin: auto;

    padding: 20px 15px 120px;

}


/* =====================================================
   WELCOME
===================================================== */

.welcome {

    text-align: center;

    padding: 25px 10px 20px;

}


.welcome-avatar {

    width: 80px;

    height: 80px;

    margin:
        0 auto 15px;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        linear-gradient(
            135deg,
            #6c63ff,
            #00c6ff
        );

    font-size: 38px;

    box-shadow:
        0 0 30px
        rgba(0,198,255,0.2);

}


.welcome h2 {

    font-size: 25px;

    margin-bottom: 8px;

}


.welcome p {

    color: #9db0c6;

    font-size: 14px;

    line-height: 1.6;

}


/* =====================================================
   QUICK QUESTIONS
===================================================== */

.quick-actions {

    display: flex;

    flex-wrap: wrap;

    gap: 10px;

    justify-content: center;

    margin:
        10px auto 25px;

}


.quick-button {

    background: #13243a;

    border:
        1px solid
        rgba(255,255,255,0.08);

    color: #dce8f5;

    padding:
        10px 14px;

    border-radius: 20px;

    font-size: 13px;

    cursor: pointer;

}


.quick-button:hover {

    background: #1b304b;

}


/* =====================================================
   MESSAGE BUBBLES
===================================================== */

.message {

    display: flex;

    margin-bottom: 18px;

    gap: 10px;

}


.message.user {

    justify-content: flex-end;

}


.message-avatar {

    width: 34px;

    height: 34px;

    min-width: 34px;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #17283d;

    font-size: 16px;

}


.message.user .message-avatar {

    background: #263b55;

}


.bubble {

    max-width: 78%;

    padding:
        12px 15px;

    border-radius: 16px;

    line-height: 1.55;

    font-size: 14px;

    white-space: pre-wrap;

}


.message.aisha .bubble {

    background: #122338;

    border:
        1px solid
        rgba(255,255,255,0.06);

    border-top-left-radius: 5px;

}


.message.user .bubble {

    background:
        linear-gradient(
            135deg,
            #3156c9,
            #3949ab
        );

    border-top-right-radius: 5px;

}


/* =====================================================
   TYPING
===================================================== */

.typing {

    display: none;

    align-items: center;

    gap: 10px;

    margin-bottom: 18px;

}


.typing.show {

    display: flex;

}


.typing-bubble {

    background: #122338;

    padding:
        12px 16px;

    border-radius: 16px;

}


.dot {

    display: inline-block;

    width: 7px;

    height: 7px;

    margin: 0 2px;

    border-radius: 50%;

    background: #8fa4bd;

    animation:
        typing 1.2s infinite;

}


.dot:nth-child(2) {

    animation-delay: .2s;

}


.dot:nth-child(3) {

    animation-delay: .4s;

}


@keyframes typing {

    0%, 60%, 100% {

        opacity: .3;

        transform:
            translateY(0);

    }

    30% {

        opacity: 1;

        transform:
            translateY(-4px);

    }

}


/* =====================================================
   INPUT AREA
===================================================== */

.input-wrapper {

    position: fixed;

    bottom: 0;

    left: 0;

    right: 0;

    background:
        rgba(7,17,31,0.96);

    backdrop-filter: blur(12px);

    border-top:
        1px solid
        rgba(255,255,255,0.08);

    padding: 12px;

    z-index: 20;

}


.input-area {

    max-width: 850px;

    margin: auto;

    display: flex;

    gap: 8px;

    align-items: flex-end;

}


#userInput {

    flex: 1;

    resize: none;

    min-height: 48px;

    max-height: 130px;

    padding:
        14px 15px;

    border-radius: 15px;

    border:
        1px solid
        rgba(255,255,255,0.1);

    background: #122238;

    color: white;

    outline: none;

    font-size: 14px;

}


#userInput::placeholder {

    color: #71869d;

}


#sendButton {

    width: 48px;

    height: 48px;

    border: none;

    border-radius: 15px;

    background:
        linear-gradient(
            135deg,
            #6c63ff,
            #00aeea
        );

    color: white;

    font-size: 20px;

    cursor: pointer;

}


#sendButton:disabled {

    opacity: .5;

    cursor: not-allowed;

}


/* =====================================================
   DISCLAIMER
===================================================== */

.disclaimer {

    text-align: center;

    color: #60758c;

    font-size: 10px;

    margin-top: 8px;

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    .chat-container {

        padding-left: 10px;

        padding-right: 10px;

    }

    .bubble {

        max-width: 86%;

    }

    .welcome h2 {

        font-size: 22px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <button
        class="back-button"
        onclick="goBack()">

        ←

    </button>


    <div class="aisha-avatar">

        A

    </div>


    <div class="header-info">

        <h1>Aisha</h1>

        <p>Trust AI Assistant</p>

    </div>

</header>



<!-- =====================================================
     CHAT
===================================================== -->

<main class="chat-container">


    <section
        class="welcome"
        id="welcome">

        <div class="welcome-avatar">

            A

        </div>


        <h2>

            Hi, I'm Aisha 👋

        </h2>


        <p>

            I'm your Trust AI assistant.
            I can teach you how Trust AI works,
            explain security features, and help
            you stay safer online.

        </p>

    </section>



    <!-- QUICK QUESTIONS -->

    <div
        class="quick-actions"
        id="quickActions">


        <button
            class="quick-button"
            onclick="quickQuestion(
                'What is Trust AI?'
            )">

            What is Trust AI?

        </button>


        <button
            class="quick-button"
            onclick="quickQuestion(
                'How do I check a suspicious message?'
            )">

            Check a message

        </button>


        <button
            class="quick-button"
            onclick="quickQuestion(
                'How does Trust AI protect me?'
            )">

            How does Trust AI protect me?

        </button>


        <button
            class="quick-button"
            onclick="quickQuestion(
                'What can you help me with?'
            )">

            What can you help me with?

        </button>


    </div>



    <!-- MESSAGES -->

    <div id="messages"></div>



    <!-- TYPING INDICATOR -->

    <div
        class="typing"
        id="typing">

        <div class="message-avatar">

            A

        </div>


        <div class="typing-bubble">

            <span class="dot"></span>

            <span class="dot"></span>

            <span class="dot"></span>

        </div>

    </div>


</main>



<!-- =====================================================
     INPUT
===================================================== -->

<div class="input-wrapper">

    <div class="input-area">


        <textarea
            id="userInput"
            placeholder="Ask Aisha anything about Trust AI..."
            rows="1"></textarea>


        <button
            id="sendButton"
            onclick="sendMessage()">

            ➤

        </button>

    </div>


    <div class="disclaimer">

        Aisha is a Trust AI assistant. Always verify
        important information before taking action.

    </div>

</div>



<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://opyjaljpowzgmkqlmjrb.supabase.co";


/* =====================================================
   ELEMENTS
===================================================== */

const userInput =
    document.getElementById("userInput");

const sendButton =
    document.getElementById("sendButton");

const messages =
    document.getElementById("messages");

const typing =
    document.getElementById("typing");

const welcome =
    document.getElementById("welcome");

const quickActions =
    document.getElementById("quickActions");


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


/* =====================================================
   ADD MESSAGE
===================================================== */

function addMessage(text, sender) {

    const message =
        document.createElement("div");

    message.className =
        "message " + sender;


    const avatar =
        document.createElement("div");

    avatar.className =
        "message-avatar";

    avatar.textContent =
        sender === "aisha"
            ? "A"
            : "👤";


    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    bubble.innerHTML =
        escapeHTML(text);


    if (sender === "aisha") {

        message.appendChild(avatar);

        message.appendChild(bubble);

    } else {

        message.appendChild(bubble);

        message.appendChild(avatar);

    }


    messages.appendChild(message);


    window.scrollTo({

        top: document.body.scrollHeight,

        behavior: "smooth"

    });

}


/* =====================================================
   AISHA AI
===================================================== */

async function askAisha(message) {

    const response = await fetch(

        SUPABASE_URL +
        "/functions/v1/trust-ai",

        {

            method: "POST",

            headers: {

                "Content-Type":
                    "application/json"

            },

            body: JSON.stringify({

                message: message

            })

        }

    );


    const data =
        await response.json();


    if (!response.ok) {

        throw new Error(

            data.error ||
            "Aisha could not respond."

        );

    }


    return data.reply ||

        "I'm sorry, I couldn't generate a response.";

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage() {

    const message =
        userInput.value.trim();


    if (!message) {

        return;

    }


    addMessage(
        message,
        "user"
    );


    userInput.value = "";

    userInput.style.height = "48px";


    welcome.style.display = "none";

    quickActions.style.display = "none";


    sendButton.disabled = true;

    typing.classList.add("show");


    try {

        const reply =
            await askAisha(message);


        typing.classList.remove("show");


        addMessage(
            reply,
            "aisha"
        );


    } catch (error) {

        console.error(
            "Aisha error:",
            error
        );


        typing.classList.remove("show");


        addMessage(

            "I'm having trouble connecting right now. Please try again in a moment.",

            "aisha"

        );

    }


    sendButton.disabled = false;

    userInput.focus();

}


/* =====================================================
   QUICK QUESTION
===================================================== */

function quickQuestion(question) {

    userInput.value =
        question;

    sendMessage();

}


/* =====================================================
   ENTER TO SEND
===================================================== */

userInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =====================================================
   AUTO RESIZE TEXTAREA
===================================================== */

userInput.addEventListener(
    "input",
    function() {

        this.style.height =
            "48px";

        this.style.height =
            Math.min(
                this.scrollHeight,
                130
            ) + "px";

    }
);


/* =====================================================
   BACK BUTTON
===================================================== */

function goBack() {

    if (
        document.referrer &&
        document.referrer.includes(
            location.hostname
        )
    ) {

        history.back();

    } else {

        window.location.href =
            "index.html";

    }

}

</script>


</body>

</html>
